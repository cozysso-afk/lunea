  const PATCH_JS = String.raw`
(function installLuneaV2Fix(){
  if (window.__LUNEA_V2_FIXED__) return;
  window.__LUNEA_V2_FIXED__ = true;

  const ARCHIVE_KEY = 'LUNEA_ARCHIVE_V2';
  const OLD_ARCHIVE_KEY = 'LUNEA_ARCHIVE';

  function esc(value) {
    return String(value ?? '').replace(/[&<>\"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
  }

  function getArchive() {
    try {
      let v2 = JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]');
      if (!Array.isArray(v2)) v2 = [];
      if (!v2.length) {
        const old = JSON.parse(localStorage.getItem(OLD_ARCHIVE_KEY) || '[]');
        if (Array.isArray(old) && old.length) {
          v2 = old.map(item => ({...item, ai:item.ai || '', savedAt:item.savedAt || item.date || ''}));
          localStorage.setItem(ARCHIVE_KEY, JSON.stringify(v2));
        }
      }
      return v2;
    } catch (e) {
      console.warn('archive read failed', e);
      return [];
    }
  }

  function setArchive(items) {
    try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(items.slice(0,100))); }
    catch(e) { alert('기록 저장 공간이 부족해요. 오래된 기록을 일부 삭제해 주세요.'); }
  }

  function safeCardsForCurrent() {
    if (typeof currentDrawnCards === 'undefined' || !Array.isArray(currentDrawnCards)) return [];
    return currentDrawnCards.map(c => {
      let str = (c.position || 'Position') + ': ' + (c.name || '') + ' (' + (c.isReversed ? '역' : '정') + ')';
      if (c.gdAttribution) str += ' [GD: ' + c.gdAttribution + ']';
      if (Array.isArray(c.subCards) && c.subCards.length) {
        str += ' [보조: ' + c.subCards.map(s => (s.name || '') + '(' + (s.isReversed ? '역' : '정') + ')').join(', ') + ']';
      }
      return str;
    });
  }

  window.saveToArchive = function saveToArchiveV2() {
    const qEl = document.getElementById('userQuestion');
    const aiEl = document.getElementById('aiDynamicText');
    const cards = safeCardsForCurrent();
    if (!cards.length) return alert('저장할 카드가 아직 없어요. 먼저 카드를 뽑아 주세요.');

    const item = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
      savedAt: new Date().toISOString(),
      date: new Date().toLocaleString('ko-KR'),
      title: (typeof currentSpreadTitle !== 'undefined' ? currentSpreadTitle : '') || 'Tarot Reading',
      category: (typeof currentCategory !== 'undefined' ? currentCategory : '') || 'GENERAL',
      q: (qEl && qEl.value.trim()) || '데일리 리딩',
      cards,
      ai: aiEl ? aiEl.innerText.trim() : '',
      profile: (typeof userProfile !== 'undefined' && userProfile) ? {...userProfile} : null
    };
    const archive = getArchive();
    archive.unshift(item);
    setArchive(archive);
    alert('✨ 카드 · 보조카드' + (item.ai ? ' · AI 해석까지' : '') + ' 기록함에 저장했어.');
  };

  window.openArchiveModal = function openArchiveModalV2() {
    const modal = document.getElementById('luneaArchiveModal');
    if (!modal) return;
    modal.classList.add('show');
    modal.setAttribute('aria-hidden','false');
    renderArchiveList();
  };

  window.closeArchiveModal = function closeArchiveModalV2() {
    const modal = document.getElementById('luneaArchiveModal');
    if (!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
  };

  window.renderArchiveList = function renderArchiveListV2() {
    const list = document.getElementById('archiveList');
    const count = document.getElementById('archiveCount');
    const search = (document.getElementById('archiveSearch')?.value || '').trim().toLowerCase();
    if (!list) return;
    const archive = getArchive();
    const filtered = archive.filter(item => {
      const blob = [item.title,item.q,(item.cards||[]).join(' '),item.ai].join(' ').toLowerCase();
      return !search || blob.includes(search);
    });
    if (count) count.textContent = '저장 ' + archive.length + '개' + (search ? ' · 검색 결과 ' + filtered.length + '개' : '');
    if (!filtered.length) {
      list.innerHTML = '<div class="archive-empty">' + (archive.length ? '검색 결과가 없어.' : '아직 저장된 리딩이 없어.<br>리딩 화면의 💾 저장 버튼을 누르면 여기에 쌓여.') + '</div>';
      return;
    }
    list.innerHTML = filtered.map(item => {
      const cardsText = (item.cards || []).join('\n');
      const ai = item.ai || '';
      return '<article class="archive-item">' +
        '<div class="archive-item-top"><h4>' + esc(item.title || 'Tarot Reading') + '</h4><span class="archive-date">' + esc(item.date || '') + '</span></div>' +
        '<div class="archive-q">Q. ' + esc(item.q || '') + '</div>' +
        '<details><summary style="font-size:10.5px;color:#bda4f8;cursor:pointer;">카드 펼쳐보기</summary><div class="archive-cards">' + esc(cardsText) + '</div></details>' +
        (ai ? '<details style="margin-top:6px;"><summary style="font-size:10.5px;color:#ffd27d;cursor:pointer;">AI 해석 펼쳐보기</summary><div class="archive-ai">' + esc(ai) + '</div></details>' : '') +
        '<div class="archive-actions"><button onclick="copyArchiveItem(\'' + item.id + '\')">복사</button><button class="danger" onclick="deleteArchiveItem(\'' + item.id + '\')">삭제</button></div>' +
        '</article>';
    }).join('');
  };

  window.copyArchiveItem = function(id) {
    const item = getArchive().find(x => String(x.id) === String(id));
    if (!item) return;
    const text = '[' + (item.title || 'Tarot Reading') + ']\n' + (item.date || '') + '\nQ. ' + (item.q || '') + '\n\n' + (item.cards || []).join('\n') + (item.ai ? '\n\n[AI 해석]\n' + item.ai : '');
    navigator.clipboard.writeText(text).then(() => alert('📋 기록을 복사했어.'));
  };

  window.copyAllArchive = function() {
    const archive = getArchive();
    if (!archive.length) return alert('복사할 기록이 없어.');
    const text = archive.map(item => '[' + (item.title || 'Tarot Reading') + ']\n' + (item.date || '') + '\nQ. ' + (item.q || '') + '\n' + (item.cards || []).join('\n') + (item.ai ? '\n[AI 해석]\n' + item.ai : '')).join('\n\n────────\n\n');
    navigator.clipboard.writeText(text).then(() => alert('📋 기록함 전체를 복사했어.'));
  };

  window.deleteArchiveItem = function(id) {
    const archive = getArchive();
    const item = archive.find(x => String(x.id) === String(id));
    if (!item) return;
    if (!confirm('이 리딩 기록을 삭제할까?')) return;
    setArchive(archive.filter(x => String(x.id) !== String(id)));
    renderArchiveList();
  };

  window.clearArchive = function() {
    if (!getArchive().length) return;
    if (!confirm('저장된 타로 기록을 전부 삭제할까? 이 작업은 되돌릴 수 없어.')) return;
    setArchive([]);
    renderArchiveList();
  };

  // ------------------------------------------------------------
  // AI CUSTOM SPREAD V3 — 질문 구조 분석 + 아키텍처 회전 + 중복 방지
  // ------------------------------------------------------------
  const SPREAD_MEMORY_KEY = 'LUNEA_SPREAD_MEMORY_V3';
  const SPREAD_ARCH_KEY = 'LUNEA_SPREAD_ARCH_V3';

  const SPREAD_ARCHITECTURES = [
    { id:'mirrored', label:'양쪽 시점 대칭형', guide:'질문자와 상대/대상을 같은 축에서 병렬 비교하고, 마지막에 관계장 또는 교차점을 둔다.' },
    { id:'threshold', label:'행동 임계점형', guide:'감정이나 의도보다 실제 행동이 일어나기 위한 억제요인, 방아쇠, 임계점, 행동 후 반응을 추적한다.' },
    { id:'fork', label:'선택지 분기형', guide:'A를 택했을 때와 B를 택했을 때를 병렬로 비교하고, 각 선택의 비용과 얻는 것을 분리한다.' },
    { id:'layers', label:'겉-속-무의식 층위형', guide:'표면 반응, 의식적 판단, 무의식 욕구, 두려움/방어를 서로 다른 자리로 분리한다.' },
    { id:'causal', label:'원인-증폭-전환점형', guide:'무엇이 시작점인지, 무엇이 상황을 키우는지, 무엇이 판을 바꾸는지를 인과 흐름으로 배치한다.' },
    { id:'timeline', label:'사건 타임라인형', guide:'과거/현재/미래 같은 고정 3단 구성이 아니라, 첫 움직임→다음 신호→임계 사건→그 뒤 반응처럼 질문에 맞는 사건 단계로 자른다.' },
    { id:'evidence', label:'증거 대 반증형', guide:'질문자가 기대하는 해석을 지지하는 신호와 반대 신호를 따로 놓고 마지막에 어느 쪽이 더 무거운지 판단한다.' },
    { id:'blindspot', label:'맹점 탐지형', guide:'이미 알고 있는 것보다 놓치고 있는 변수, 잘못 읽고 있는 신호, 숨은 이해관계, 현실 검증 포인트를 중심으로 둔다.' },
    { id:'relationship_loop', label:'관계 반복패턴형', guide:'끌림→방어→접촉→갈등→후퇴처럼 두 사람 사이에서 반복되는 순환과 끊어야 할 지점을 찾는다.' },
    { id:'resource_risk', label:'자원-리스크 균형형', guide:'내가 가진 강점/자원, 외부 기회, 손실 위험, 무리했을 때의 대가, 안전한 행동 범위를 분리한다.' }
  ];

  function getSpreadMemory() {
    try {
      const v = JSON.parse(localStorage.getItem(SPREAD_MEMORY_KEY) || '[]');
      return Array.isArray(v) ? v.slice(0, 12) : [];
    } catch(e) { return []; }
  }

  function getArchitectureHistory() {
    try {
      const v = JSON.parse(localStorage.getItem(SPREAD_ARCH_KEY) || '[]');
      return Array.isArray(v) ? v.slice(0, 8) : [];
    } catch(e) { return []; }
  }

  function rememberSpread(question, spread, archId) {
    try {
      const mem = getSpreadMemory();
      mem.unshift({ q:question, title:spread.spreadTitle, positions:spread.positions, arch:archId, at:Date.now() });
      localStorage.setItem(SPREAD_MEMORY_KEY, JSON.stringify(mem.slice(0,12)));
      const ah = getArchitectureHistory();
      ah.unshift(archId);
      localStorage.setItem(SPREAD_ARCH_KEY, JSON.stringify(ah.slice(0,8)));
    } catch(e) { console.warn('spread memory save failed', e); }
  }

  function cryptoPick(list) {
    if (!list || !list.length) return null;
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return list[a[0] % list.length];
  }

  function detectQuestionFamily(q) {
    const t = String(q || '').toLowerCase();
    if (/재회|헤어진|전남친|전여친|다시 만나|연락.*올|차단|미련/.test(t)) return 'reunion';
    if (/속마음|마음|호감|좋아|사랑|썸|연애|상대/.test(t)) return 'love';
    if (/언제|시기|몇.*일|이번주|이번 달|타이밍|연락/.test(t)) return 'timing';
    if (/시험|합격|공시|관세|자격증|공부|성적/.test(t)) return 'exam';
    if (/직장|회사|이직|퇴사|면접|승진|커리어/.test(t)) return 'career';
    if (/주식|매수|매도|익절|손절|종목|투자|코인/.test(t)) return 'trading';
    if (/외모|얼굴|몸매|피지컬|매력|첫인상/.test(t)) return 'attraction';
    if (/선택|어느|vs|할까|말까|a와|b와/.test(t)) return 'decision';
    return 'general';
  }

  function chooseArchitecture(question, forcedDifferentFrom) {
    const family = detectQuestionFamily(question);
    const preferred = {
      reunion:['relationship_loop','threshold','layers','timeline','evidence','blindspot'],
      love:['layers','mirrored','threshold','blindspot','relationship_loop','evidence'],
      timing:['timeline','threshold','causal','evidence'],
      exam:['resource_risk','causal','evidence','blindspot','timeline'],
      career:['fork','resource_risk','causal','blindspot','evidence'],
      trading:['resource_risk','evidence','threshold','causal','fork'],
      attraction:['mirrored','layers','evidence','blindspot'],
      decision:['fork','evidence','resource_risk','causal'],
      general:['blindspot','causal','layers','evidence','threshold','mirrored']
    }[family] || ['blindspot','causal','layers'];

    const history = getArchitectureHistory().slice(0,3);
    let pool = preferred.filter(id => !history.includes(id) && id !== forcedDifferentFrom);
    if (!pool.length) pool = preferred.filter(id => id !== forcedDifferentFrom);
    const id = cryptoPick(pool) || preferred[0];
    return SPREAD_ARCHITECTURES.find(x => x.id === id) || SPREAD_ARCHITECTURES[0];
  }

  function normalizeWords(text) {
    const stop = new Set(['현재','상황','미래','결과','조언','핵심','변수','흐름','가능성','에너지','카드','질문','분석','상대방','질문자']);
    return (String(text || '').toLowerCase().match(/[가-힣a-z0-9]{2,}/g) || []).filter(x => !stop.has(x));
  }

  function jaccardSpread(a, b) {
    const A = new Set(normalizeWords((a || []).join(' ')));
    const B = new Set(normalizeWords((b || []).join(' ')));
    if (!A.size || !B.size) return 0;
    let inter = 0;
    A.forEach(x => { if (B.has(x)) inter++; });
    const union = A.size + B.size - inter;
    return union ? inter / union : 0;
  }

  function spreadQuality(spread, question) {
    if (!spread || !Array.isArray(spread.positions)) return { ok:false, reason:'positions 없음' };
    if (spread.positions.length < 2 || spread.positions.length > 9) return { ok:false, reason:'카드 수 범위 오류' };
    const positions = spread.positions.map(x => String(x || '').trim()).filter(Boolean);
    if (positions.length !== spread.positions.length) return { ok:false, reason:'빈 포지션' };
    const unique = new Set(positions.map(x => x.replace(/^\d+[.)]\s*/, '').toLowerCase()));
    if (unique.size !== positions.length) return { ok:false, reason:'중복 포지션' };

    const genericRx = /(현재 상황|숨겨진 변수|미래의 결과|최종 결과|핵심 조언|앞으로의 흐름|장애물과 조언)/;
    const genericCount = positions.filter(p => genericRx.test(p)).length;
    if (genericCount >= Math.max(2, Math.ceil(positions.length * 0.45))) return { ok:false, reason:'너무 전형적임' };

    const recent = getSpreadMemory();
    const worst = recent.reduce((m, item) => Math.max(m, jaccardSpread(positions, item.positions || [])), 0);
    if (worst > 0.62) return { ok:false, reason:'최근 스프레드와 유사도 높음 ' + worst.toFixed(2) };

    const qWords = new Set(normalizeWords(question));
    const pWords = new Set(normalizeWords(positions.join(' ')));
    let overlap = 0;
    qWords.forEach(w => { if (pWords.has(w)) overlap++; });
    if (qWords.size >= 3 && overlap === 0) return { ok:false, reason:'질문 고유어 반영 부족' };
    return { ok:true, reason:'ok' };
  }

  window.generateDynamicFallbackSpread = function(question) {
    const arch = chooseArchitecture(question);
    const spread = fallbackSpreadV3(question, arch);
    rememberSpread(question, spread, arch.id);
    return spread;
  };

  async function callSpreadDesigner(apiKey, model, question, architecture, retryReason) {
    const recent = getSpreadMemory().slice(0,5).map((x,i) => (i+1) + ') ' + (x.positions || []).join(' / ')).join('\n');
    const endpoint = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(apiKey);
    const prompt = [
      '너는 타로를 해석하는 사람이 아니라, 질문을 구조화하는 최고급 TAROT SPREAD ARCHITECT다.',
      '',
      '[사용자 질문]',
      '"' + question + '"',
      '',
      '[이번에 강제로 사용할 설계 골격]',
      architecture.label + ': ' + architecture.guide,
      '',
      '[절대 규칙]',
      '1. 질문의 명사, 관계, 시간조건, 선택지, 걱정 포인트를 먼저 분해하고 각각 다른 카드 자리에 배정한다.',
      '2. "현재 상황 → 장애물 → 미래 → 조언" 같은 교과서형 배열을 금지한다.',
      '3. 각 포지션은 서로 다른 질문에 답해야 하며, 문장만 바꾼 중복 포지션을 금지한다.',
      '4. 카드 수는 질문 복잡도에 따라 2~9장. 무조건 4장/5장으로 맞추지 않는다.',
      '5. 관계 질문이면 감정과 행동을 분리한다. 좋아한다/미련 있다와 실제 연락·접근 행동은 별도 포지션이어야 한다.',
      '6. 시기 질문이면 타로만으로 날짜를 단정하지 말고, 전조→방아쇠→임계점→첫 행동처럼 사건 단계 또는 조건 기반 타이밍으로 설계한다.',
      '7. 선택 질문이면 두 선택지를 같은 기준으로 병렬 비교한다.',
      '8. 사용자의 질문에 나온 구체적 단어를 포지션 명칭에 적극 반영한다. 추상어만 쓰지 않는다.',
      '9. 아래 최근 배열과 비슷한 구조/어휘를 피한다.',
      recent || '(최근 기록 없음)',
      retryReason ? ('10. 직전 시안이 거절된 이유: ' + retryReason + '. 반드시 다른 구조로 다시 설계한다.') : '',
      '',
      '[출력]',
      'spreadTitle: 질문에 특화된 제목',
      'designRationale: 왜 이 구조와 장수를 선택했는지 1~2문장',
      'layoutType: 이번 설계 골격 id (' + architecture.id + ')',
      'positions: 2~9개의 구체적 카드 자리'
    ].filter(Boolean).join('\n');

    const schema = {
      type:'object',
      properties:{
        spreadTitle:{type:'string'},
        designRationale:{type:'string'},
        layoutType:{type:'string'},
        positions:{type:'array', items:{type:'string'}}
      },
      required:['spreadTitle','designRationale','layoutType','positions']
    };

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 20000);
    try {
      const res = await fetch(endpoint, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({
          contents:[{parts:[{text:prompt}]}],
          generationConfig:{
            temperature:1.08,
            topP:0.97,
            responseMimeType:'application/json',
            responseSchema:schema
          }
        })
      });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
      const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!raw) throw new Error('빈 응답');
      const parsed = JSON.parse(raw);
      parsed.positions = (parsed.positions || []).slice(0,9).map((p,idx) => String(p).replace(/^\d+[.)]\s*/, (idx+1) + '. '));
      return parsed;
    } finally {
      clearTimeout(timeoutId);
    }
  }

  window.requestAiSpreadDesign = async function(questionText) {
    const question = String(questionText || '').trim() || '나에게 지금 가장 중요한 흐름';
    const apiKey = localStorage.getItem('LUNEA_API_KEY') || localStorage.getItem('VELOUR_API_KEY');
    const model = localStorage.getItem('LUNEA_MODEL') || 'gemini-2.5-flash';

    if (!apiKey) return window.generateDynamicFallbackSpread(question);

    let arch = chooseArchitecture(question);
    try {
      let spread = await callSpreadDesigner(apiKey, model, question, arch, '');
      let quality = spreadQuality(spread, question);
      if (!quality.ok) {
        const prevArch = arch.id;
        arch = chooseArchitecture(question, prevArch);
        spread = await callSpreadDesigner(apiKey, model, question, arch, quality.reason);
        quality = spreadQuality(spread, question);
      }
      if (!quality.ok) {
        console.warn('AI spread rejected twice:', quality.reason);
        spread = fallbackSpreadV3(question, arch);
      }
      rememberSpread(question, spread, arch.id);
      return spread;
    } catch(e) {
      console.warn('Spread V3 fallback:', e);
      const spread = fallbackSpreadV3(question, arch);
      rememberSpread(question, spread, arch.id);
      return spread;
    }
  };

  function flipFromPointer(wrapper) {
    if (!wrapper) return;
    const card = wrapper.querySelector('.tarot-card');
    if (!card || card.classList.contains('flipped')) return;
    const match = String(card.id || '').match(/card-(\d+)/);
    if (!match) return;
    const idx = Number(match[1]);
    card.classList.add('flipped');
    if (typeof window.renderCardResult === 'function') window.renderCardResult(idx);
  }

  function installGridDelegate() {
    const grid = document.getElementById('cardsGrid');
    if (!grid || grid.dataset.luneaPointerFix === '1') return;
    grid.dataset.luneaPointerFix = '1';
    const eventName = window.PointerEvent ? 'pointerup' : 'touchend';
    grid.addEventListener(eventName, function(e) {
      const wrapper = e.target.closest && e.target.closest('.tarot-card-wrapper');
      if (!wrapper) return;
      flipFromPointer(wrapper);
    }, { passive: true });
  }

  installGridDelegate();

  const originalExecuteSpread = window.executeSpread;
  if (typeof originalExecuteSpread === 'function') {
    window.executeSpread = function(qText) {
      const bs = document.getElementById('bottomSheet');
      if (bs) bs.classList.remove('open');
      const modal = document.getElementById('spreadModal');
      if (modal) {
        modal.style.display = 'flex';
        modal.style.pointerEvents = 'auto';
        modal.setAttribute('aria-hidden','false');
      }
      originalExecuteSpread(qText);
      const content = modal && modal.querySelector('.modal-content');
      if (content) content.scrollTop = 0;
      requestAnimationFrame(installGridDelegate);
    };
  }

  window.closeModal = function closeModalV2() {
    const modal = document.getElementById('spreadModal');
    if (!modal) return;
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden','true');
    modal.style.pointerEvents = 'none';
    const content = modal.querySelector('.modal-content');
    if (content) content.scrollTop = 0;
    if (document.activeElement && typeof document.activeElement.blur === 'function') document.activeElement.blur();
    requestAnimationFrame(() => { if (!modal.classList.contains('show')) modal.style.display = 'none'; });
  };

  document.addEventListener('click', function(e) {
    const archiveModal = document.getElementById('luneaArchiveModal');
    if (archiveModal && e.target === archiveModal) closeArchiveModal();
  });

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) installGridDelegate();
  });
})();`;

  try {
    const res = await fetch(SOURCE, { cache: 'no-store' });
    if (!res.ok) throw new Error('원본 로드 실패: HTTP ' + res.status);

  }
})();
