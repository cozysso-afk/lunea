<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>LUNEA - Celestial Tarot Sanctuary</title>
    <link rel="apple-touch-icon" href="apple-touch-icon.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Noto+Serif+KR:wght@300;400;600;700&family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0e0b16;
            --moon-glow: #bda4f8;
            --gold-spark: #ffd27d;
            --glass-panel: rgba(26, 21, 38, 0.75);
            --glass-border: rgba(197, 178, 250, 0.22);
            --text-pure: #f9f7fd;
            --text-dim: #a69cb8;
            --radius-box: 22px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            word-break: keep-all;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #06040a;
            font-family: 'Pretendard', -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 10%, #201738 0%, #0d0a17 60%, #06040a 100%);
            background-attachment: fixed;
            color: var(--text-pure);
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 140px 16px;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 8px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0;
        }
        .celestial-moon {
            width: 36px; height: 36px;
            min-width: 36px;
            background: linear-gradient(135deg, #e4d7ff 0%, #7e5dc4 60%, #3d2475 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 18px rgba(189, 164, 248, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .logo-text h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-size: 19px;
            letter-spacing: 2px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #dcd0ff 70%, #ffd27d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }
        .logo-text p {
            margin: 0;
            font-size: 8.5px;
            color: var(--text-dim);
            letter-spacing: 1.2px;
            font-weight: 600;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }
        .icon-btn {
            background: var(--glass-panel);
            border: 1px solid var(--glass-border);
            padding: 6px 9px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-pure);
            cursor: pointer;
            backdrop-filter: blur(10px);
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .profile-chip-bar {
            background: rgba(189, 164, 248, 0.08);
            border: 1px solid rgba(189, 164, 248, 0.2);
            border-radius: 14px;
            padding: 9px 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            gap: 6px;
        }
        .profile-chip-info {
            display: flex;
            gap: 5px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .profile-chip-info::-webkit-scrollbar { display: none; }
        .p-tag {
            background: rgba(255,255,255,0.08);
            padding: 3px 7px;
            border-radius: 8px;
            color: var(--gold-spark);
            white-space: nowrap;
            font-size: 10.5px;
        }

        .daily-orbit-card {
            background: linear-gradient(145deg, rgba(62, 45, 99, 0.45) 0%, rgba(20, 15, 33, 0.7) 100%);
            border: 1px solid rgba(218, 196, 255, 0.35);
            border-radius: var(--radius-box);
            padding: 16px 14px;
            margin-bottom: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .daily-text { flex: 1; min-width: 0; }
        .daily-text h3 {
            margin: 0 0 4px 0;
            font-family: 'Cinzel', 'Noto Serif KR', serif;
            font-size: 15.5px;
            color: #f1ebff;
            letter-spacing: 0.5px;
        }
        .daily-text p {
            margin: 0;
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.4;
        }
        .daily-btn {
            background: linear-gradient(135deg, #a582ff 0%, #6842b8 100%);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            padding: 10px 13px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .section-tag {
            font-family: 'Cinzel', serif;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--moon-glow);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .section-heading {
            font-family: 'Noto Serif KR', serif;
            font-size: 18px;
            margin: 0 0 14px 0;
            font-weight: 600;
        }

        .category-card {
            background: var(--glass-panel);
            border-radius: var(--radius-box);
            margin-bottom: 11px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(14px);
            overflow: hidden;
            width: 100%;
        }
        .category-header {
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .cat-icon-title { display: flex; align-items: center; gap: 11px; min-width: 0; }
        .cat-icon {
            width: 34px; height: 34px;
            background: rgba(189, 164, 248, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--moon-glow);
            font-size: 13px;
            border: 1px solid rgba(189, 164, 248, 0.25);
            flex-shrink: 0;
        }
        .cat-text h3 {
            margin: 0;
            font-family: 'Cinzel', 'Noto Serif KR', serif;
            font-size: 14px;
            letter-spacing: 0.8px;
            font-weight: 700;
        }
        .cat-text p { margin: 2px 0 0 0; font-size: 10.5px; color: var(--text-dim); }
        .toggle-btn { font-size: 18px; color: var(--text-dim); transition: transform 0.3s ease; font-weight: 300; flex-shrink: 0; }
        .category-content { display: none; padding: 0 16px 6px 16px; }
        .category-card.active .category-content { display: block; }
        .category-card.active .toggle-btn { transform: rotate(45deg); color: var(--moon-glow); }

        .reading-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
            gap: 8px;
        }
        .reading-item h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 600; color: #eee8f8; }
        .reading-item p { margin: 0; font-size: 10.5px; color: var(--text-dim); }
        .card-count {
            background: rgba(189, 164, 248, 0.15);
            color: #d6c5ff;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid rgba(189, 164, 248, 0.3);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 5px; color: #dfd8ee; }
        textarea, input, select {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 10px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        select option { background: #1a1526; color: #fff; }
        textarea { resize: none; height: 60px; }
        textarea:focus, input:focus, select:focus { border-color: var(--moon-glow); }

        .radio-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 6px;
            cursor: pointer;
        }
        .radio-box.selected { background: rgba(189, 164, 248, 0.14); border-color: var(--moon-glow); }
        .radio-box h5 { margin: 0 0 2px 0; font-size: 12px; font-weight: 600; color: #fff; }
        .radio-box p { margin: 0; font-size: 10px; color: var(--text-dim); }

        .draw-btn {
            width: 100%;
            background: linear-gradient(135deg, #a582ff 0%, #6842b8 100%);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 8px 24px rgba(126, 93, 196, 0.4);
            white-space: nowrap;
        }

        .modal-layer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 3, 10, 0.92);
            backdrop-filter: blur(18px);
            z-index: 500;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 14px;
        }
        .modal-layer.show { display: flex !important; }
        
        .modal-content {
            background: #140f21;
            border: 1px solid var(--glass-border);
            width: 100%; max-width: 440px; max-height: 90vh;
            border-radius: 24px; padding: 20px 16px;
            overflow-y: auto; position: relative;
            box-shadow: 0 24px 60px rgba(0,0,0,0.7);
            text-align: left;
        }
        .close-modal {
            position: absolute;
            top: 14px; right: 16px;
            background: none; border: none; font-size: 24px;
            color: var(--text-dim); cursor: pointer;
        }

        .action-bar {
            display: flex; gap: 5px; justify-content: center;
            margin: 10px 0 12px 0; flex-wrap: wrap;
        }
        .act-btn {
            background: rgba(189, 164, 248, 0.12);
            border: 1px solid rgba(189, 164, 248, 0.25);
            color: #d6c5ff; padding: 6px 10px;
            border-radius: 12px; font-size: 10.5px;
            font-weight: 600; cursor: pointer; white-space: nowrap;
        }

        .cards-grid {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 7px; margin: 10px 0 14px 0; perspective: 1000px;
        }
        .tarot-card-wrapper {
            width: 78px; height: 128px; cursor: pointer;
            animation: cardSpawn 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0; transform: translateY(18px) scale(0.95);
        }

        @keyframes cardSpawn { to { opacity: 1; transform: translateY(0) scale(1); } }

        .tarot-card {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.3, 0.8, 0.2, 1);
            border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.5);
        }
        .tarot-card.flipped { transform: rotateY(180deg); }
        .tarot-card.reversed .card-front img { transform: rotate(180deg); }

        .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 10px;
            background: linear-gradient(135deg, #2b1f47 0%, #150f26 100%);
            border: 1px solid rgba(218, 196, 255, 0.4);
            box-shadow: inset 0 0 10px rgba(189, 164, 248, 0.3);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .card-back img.deck-back-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; border-radius: 9px; display: block;
        }
        .card-back::before {
            content: ''; position: absolute; width: 76%; height: 86%;
            border: 1px solid rgba(255,255,255,0.25); border-radius: 6px;
            pointer-events: none; z-index: 2;
        }
        .aurora-star {
            font-size: 20px; color: #ffd27d;
            text-shadow: 0 0 10px rgba(255, 210, 125, 0.8);
            margin-bottom: 2px; z-index: 1;
        }
        .aurora-brand {
            font-family: 'Cinzel', serif; font-size: 8px;
            letter-spacing: 2px; font-weight: 700; color: #e3d7ff; z-index: 1;
        }

        .card-front {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 10px; background: #fff;
            transform: rotateY(180deg); border: 1.5px solid rgba(218, 196, 255, 0.6);
            overflow: hidden;
        }
        .card-front img { width: 100%; height: 100%; object-fit: cover; }

        .card-info-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px; padding: 12px 14px; margin-top: 8px;
            text-align: left; border: 1px solid rgba(255,255,255,0.08);
            animation: fadeIn 0.35s ease;
        }
        .pos-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .pos-badge { font-size: 10.5px; font-weight: 700; color: var(--moon-glow); }
        .single-add-btn {
            background: rgba(189, 164, 248, 0.15); border: 1px solid rgba(189, 164, 248, 0.3);
            color: #dcd0ff; padding: 3px 7px; border-radius: 8px;
            font-size: 9.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .single-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .resonance-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 210, 125, 0.2) 0%, rgba(189, 164, 248, 0.2) 100%);
            border: 1px solid var(--gold-spark); color: var(--gold-spark);
            padding: 3px 7px; border-radius: 7px; font-size: 9.5px;
            font-weight: 700; margin-top: 4px;
        }

        .sub-cards-container {
            margin-top: 6px; padding-top: 6px;
            border-top: 1px dashed rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 4px;
        }
        .sub-card-tag {
            background: rgba(165, 130, 255, 0.08);
            border-left: 2px solid var(--moon-glow);
            padding: 4px 8px; border-radius: 0 7px 7px 0;
            font-size: 10.5px; color: #e9e4f5;
        }

        .card-info-box h4 { margin: 0 0 2px 0; font-size: 13px; color: #f5f2fd; }
        .card-info-box p { margin: 0; font-size: 11px; color: var(--text-dim); line-height: 1.45; }

        .ai-reading-card {
            background: linear-gradient(145deg, rgba(62, 45, 99, 0.45) 0%, rgba(26, 18, 45, 0.88) 100%);
            border: 1px solid rgba(189, 164, 248, 0.35);
            border-radius: 16px; padding: 16px; margin-top: 12px;
            text-align: left; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            animation: fadeIn 0.4s ease;
        }
        .ai-reading-card h4 {
            margin: 0 0 8px 0; font-family: 'Cinzel', 'Noto Serif KR', serif;
            font-size: 14.5px; color: var(--gold-spark); display: flex; align-items: center; gap: 6px;
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 7px;
        }
        .ai-reading-body
