<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">LUNEA Lenormand</title>
  <desc id="desc">Nine symbolic Lenormand cards arranged in a three by three grid with a teal, silver and lavender celestial frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d47"/>
      <stop offset="0.48" stop-color="#0b2633"/>
      <stop offset="1" stop-color="#12152b"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3e8"/>
      <stop offset="0.46" stop-color="#f2edf7"/>
      <stop offset="0.72" stop-color="#c9b4ff"/>
      <stop offset="1" stop-color="#68b9c2"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#d9c6ff" stop-opacity="0.62"/>
      <stop offset="0.45" stop-color="#87d8df" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#081020" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="22" y="22" width="468" height="468" rx="112" fill="#080d1c"/>
  <rect x="27" y="27" width="458" height="458" rx="108" fill="url(#bg)" stroke="url(#rim)" stroke-width="9"/>
  <rect x="43" y="43" width="426" height="426" rx="92" fill="none" stroke="#d8edf0" stroke-opacity="0.30" stroke-width="2"/>
  <circle cx="256" cy="257" r="183" fill="url(#centerGlow)"/>
  <ellipse cx="256" cy="265" rx="184" ry="166" fill="#8be4e8" opacity="0.06" filter="url(#soft)"/>

  <!-- celestial accents -->
  <path d="M90 103c25-1 45-21 46-46-18 12-44 8-58-9-3 22 2 39 12 55Z" fill="#ecf8f5" opacity="0.92"/>
  <g fill="#e7f9fb" opacity="0.88">
    <path d="M418 91l4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
    <path d="M102 417l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    <path d="M418 405l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    <circle cx="160" cy="82" r="3"/><circle cx="357" cy="74" r="2.5"/><circle cx="82" cy="333" r="2.6"/>
  </g>

  <!-- decorative leaves -->
  <g fill="none" stroke="#8fd4ce" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <path d="M62 180c28 18 36 42 36 69"/>
    <path d="M78 193c-16-2-23-12-22-28 16 3 23 12 22 28Z"/>
    <path d="M88 217c-18 0-27-8-29-24 17 0 26 8 29 24Z"/>
    <path d="M450 180c-28 18-36 42-36 69"/>
    <path d="M434 193c16-2 23-12 22-28-16 3-23 12-22 28Z"/>
    <path d="M424 217c18 0 27-8 29-24-17 0-26 8-29 24Z"/>
  </g>

  <!-- 3 x 3 cards -->
  <g stroke="#cfe9ec" stroke-width="3">
    <g fill="#123945"><rect x="110" y="122" width="84" height="84" rx="17"/><rect x="214" y="122" width="84" height="84" rx="17"/><rect x="318" y="122" width="84" height="84" rx="17"/></g>
    <g fill="#10333f"><rect x="110" y="226" width="84" height="84" rx="17"/><rect x="214" y="226" width="84" height="84" rx="17" fill="#372c51" stroke="#dccaff" stroke-width="4"/><rect x="318" y="226" width="84" height="84" rx="17"/></g>
    <g fill="#102f3a"><rect x="110" y="330" width="84" height="84" rx="17"/><rect x="214" y="330" width="84" height="84" rx="17"/><rect x="318" y="330" width="84" height="84" rx="17"/></g>
  </g>

  <!-- heart -->
  <path d="M152 181c-22-15-30-28-30-39 0-12 9-20 20-20 7 0 12 4 16 10 4-6 10-10 17-10 11 0 20 8 20 20 0 12-10 25-31 39l-6 4Z" fill="#e9f4f2" transform="translate(-6 1) scale(.72) translate(60 36)"/>
  <!-- tree -->
  <g stroke="#e8f5f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M256 183v-31"/><path d="M256 167l-15 12M256 163l15 15"/></g><circle cx="256" cy="145" r="23" fill="#dff2ef" opacity="0.92"/><circle cx="240" cy="153" r="16" fill="#cde9e4"/><circle cx="272" cy="153" r="16" fill="#cde9e4"/>
  <!-- bird -->
  <path d="M339 171c17-20 35-24 53-13-13 2-21 9-27 19 11-6 21-5 31 2-19 15-39 14-57-8Z" fill="#e9f6f4"/>
  <!-- clover -->
  <g fill="#86cfc0"><circle cx="142" cy="255" r="13"/><circle cx="162" cy="255" r="13"/><circle cx="142" cy="275" r="13"/><circle cx="162" cy="275" r="13"/><path d="M154 277c5 12 8 18 4 27" stroke="#86cfc0" stroke-width="5" fill="none"/></g>
  <!-- center star -->
  <g filter="url(#glow)"><path d="M256 239l8 23 24 8-24 8-8 24-8-24-24-8 24-8Z" fill="#efe6ff"/><circle cx="256" cy="270" r="5" fill="#8bd8df"/></g>
  <!-- letter -->
  <g fill="none" stroke="#ebf6f6" stroke-width="5" stroke-linejoin="round"><rect x="334" y="247" width="52" height="39" rx="5"/><path d="m337 251 23 18 23-18"/></g>
  <!-- dog -->
  <path d="M128 384c5-20 19-28 36-23 8 2 14 8 17 17v22h-12v-14h-33v14h-11v-16h3Z" fill="#e7f4f1"/><path d="M132 366c-7-14-5-23 6-28 4 9 8 15 16 18" fill="#e7f4f1"/>
  <!-- sun -->
  <g fill="#f3f0dd" stroke="#f3f0dd" stroke-width="4"><circle cx="256" cy="372" r="18"/><path d="M256 341v12M256 391v12M225 372h12M275 372h12M234 350l9 9M269 385l9 9M278 350l-9 9M243 385l-9 9"/></g>
  <!-- fish -->
  <path d="M339 370c13-15 31-18 46-7l14-10-4 18 4 18-14-9c-15 10-33 7-46-10Zm11 0c10 6 17 6 26 0-9-6-16-6-26 0Z" fill="#dff2f0"/>

  <rect x="99" y="111" width="314" height="314" rx="31" fill="none" stroke="#8dd1d4" stroke-opacity="0.22" stroke-width="2"/>
</svg>