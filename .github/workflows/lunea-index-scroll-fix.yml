name: LUNEA one-shot index scroll fix

on:
  push:
    paths:
      - '.github/workflows/lunea-index-scroll-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch base sheet scrolling and bust loader cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # 1) Put iOS-safe scrolling into the base bottom-sheet CSS itself.
          #    This works even before any additive JS helper loads.
          m = re.search(r'\.sheet\{([^}]*)\}', s)
          if not m:
              raise SystemExit('base .sheet rule not found')
          rule = m.group(0)
          if 'overflow-y:auto' not in rule:
              patched = rule[:-1] + ';max-height:calc(100dvh - max(8px, env(safe-area-inset-top)));overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}'
              s = s[:m.start()] + patched + s[m.end():]

          # 2) Force iPhone/PWA to request the current structural loader instead
          #    of reusing the previously cached v=412 URL.
          s, n = re.subn(r'lunea-structural-routing-v4\.js\?v=\d+', 'lunea-structural-routing-v4.js?v=414', s, count=1)
          if n != 1:
              raise SystemExit('structural loader tag not found')

          if s == original:
              raise SystemExit('nothing changed')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit index fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix iOS manual sheet scrolling and bust loader cache"
          git push
