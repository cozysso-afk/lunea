name: Apply Journal Validation Mobile V5
on:
  push:
    branches: [fix/horary-future-window-save-v58]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix journal validation mobile V5') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horary-future-window-save-v58
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/fix_journal_validation_mobile_v5.py
      - name: Syntax checks
        run: |
          node --check lunea-reading-journal-v2.js
          node --check lunea-journal-header-fix-v1.js
          node --check tests/journal-validation-mobile-v4.e2e.mjs
      - name: Commit patch
        run: |
          rm -f .github/workflows/_apply-journal-validation-mobile-v5.yml
          rm -f .github/scripts/fix_journal_validation_mobile_v5.py
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix journal validation mobile V5'
          git push origin HEAD:fix/horary-future-window-save-v58
