name: Intimacy Oracle candidate WebKit A

on:
  push:
    branches:
      - test/intimacy-oracle-webkit-ad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply candidate patch in runner only
        run: python3 tests/apply-intimacy-oracle-candidate.py

      - name: Apply confirmed restore-race guard and A harness correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'patched {path}: {expected}')

          rep(
              'lunea-intimacy-oracle-ui-v36.js',
              "function syncOracleToCards(){const s=stateNow();if(!s)return;",
              "function syncOracleToCards(){if(W.__LUNEA_DRAFT_RESTORING_INTIMACY_ORACLE__)return;const s=stateNow();if(!s)return;"
          )
          rep(
              'lunea-reading-draft-v1.js',
              "      restoring = true;\n      const s = setStateFromDraft(d);",
              "      restoring = true;\n      const restoringIntimacyOracle=String(d.category||'').toUpperCase()==='INTIMACY'&&!!d.intimacyOracle;\n      if(restoringIntimacyOracle)W.__LUNEA_DRAFT_RESTORING_INTIMACY_ORACLE__=true;\n      const s = setStateFromDraft(d);"
          )
          rep(
              'lunea-reading-draft-v1.js',
              "        if(d.intimacyOracle){const snapshot=clone(d.intimacyOracle);const bridge=W.LUNEA_INTIMACY_AI_BRIDGE_V34;if(bridge?.restoreOracleDraft)bridge.restoreOracleDraft(snapshot);else W.__LUNEA_PENDING_INTIMACY_ORACLE_DRAFT_V2__=snapshot;}\n        restoring = false;",
              "        if(d.intimacyOracle){const snapshot=clone(d.intimacyOracle);const bridge=W.LUNEA_INTIMACY_AI_BRIDGE_V34;if(bridge?.restoreOracleDraft)bridge.restoreOracleDraft(snapshot);else W.__LUNEA_PENDING_INTIMACY_ORACLE_DRAFT_V2__=snapshot;}\n        if(restoringIntimacyOracle)W.__LUNEA_DRAFT_RESTORING_INTIMACY_ORACLE__=false;\n        restoring = false;"
          )
          rep(
              'lunea-reading-draft-v1.js',
              "    } catch (err) {\n      restoring = false;",
              "    } catch (err) {\n      W.__LUNEA_DRAFT_RESTORING_INTIMACY_ORACLE__=false;\n      restoring = false;"
          )

          # A-only harness corrections. Product code is not changed by these three replacements.
          rep(
              'tests/intimacy-oracle-webkit-ad.e2e.mjs',
              "    assert.match(stale.marker,/36\\.4/);",
              "    assert.match(stale.marker,/^oracle-/);"
          )
          rep(
              'tests/intimacy-oracle-webkit-ad.e2e.mjs',
              "      page.waitForURL(/lunea_v=webkit-ad-test/,{timeout:15000}),",
              "      page.waitForURL(/lunea_v=webkit-ad-test/,{timeout:15000,waitUntil:'commit'}),"
          )
          rep(
              'tests/intimacy-oracle-webkit-ad.e2e.mjs',
              "    await openIntimacyAndDraw(page,'fresh V36.5 버튼 검증');",
              "    await page.waitForLoadState('domcontentloaded',{timeout:60000});\n    await restoreLastReading(page);\n    await page.waitForFunction(()=>typeof state!=='undefined'&&String(state.category||'').toUpperCase()==='INTIMACY'&&Array.isArray(state.drawn)&&state.drawn.length>0,{timeout:15000});\n    assert.equal(await page.evaluate(()=>document.querySelector('#question')?.value||''),'stale V36.4 경계 검증');"
          )
          PY

      - name: Syntax and invariant checks
        run: |
          node --check lunea-intimacy-oracle-ui-v36.js
          node --check lunea-intimacy-ai-bridge-v34.js
          node --check lunea-reading-draft-v1.js
          node --check lunea-cache-refresh-v1.js
          node --check tests/intimacy-oracle-webkit-ad.e2e.mjs
          node tests/intimacy-oracle-candidate-contract.mjs
          node tests/reading-lifecycle-v59.test.mjs

      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-intimacy-webkit-a.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-intimacy-webkit-a.log
          exit 1

      - name: Run WebKit A regression
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/intimacy-oracle-webkit-ad.e2e.mjs

      - name: Show local server log
        if: failure()
        run: cat /tmp/lunea-intimacy-webkit-a.log || true
