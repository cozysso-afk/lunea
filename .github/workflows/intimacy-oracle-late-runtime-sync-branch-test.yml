name: Recovery 390432a audit checks

on:
  push:
    branches:
      - fix/recovery-390432a-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check recovery files
        run: |
          node --check lunea-cache-refresh-v1.js
          node --check lunea-intimacy-ai-bridge-v34.js
          node --check lunea-reading-draft-v1.js
          node --check tests/intimacy-oracle-late-runtime.e2e.mjs
          node --check tests/reading-lifecycle-v59.e2e.mjs
      - name: Recovery source invariants
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const cache=fs.readFileSync('lunea-cache-refresh-v1.js','utf8');
          const bridge=fs.readFileSync('lunea-intimacy-ai-bridge-v34.js','utf8');
          const draft=fs.readFileSync('lunea-reading-draft-v1.js','utf8');
          assert.match(cache,/embedded && embedded !== remote/,'build refresh must require an actual version mismatch');
          assert.doesNotMatch(cache,/embedded !== remote \|\| forceRefresh/,'same-build force refresh must stay removed');
          assert.match(bridge,/restoreOracleDraftExact/,'bridge must expose exact async restore');
          assert.match(bridge,/typeof ui\?\.serializeOracleDraft==='function'/,'runtime readiness must require exact-draft serialization');
          assert.match(bridge,/typeof ui\?\.restoreSerializedOracle==='function'/,'runtime readiness must require exact-draft restore');
          assert.match(draft,/intimacyOracleFallback/,'draft must retain the exact Oracle snapshot while runtime is late');
          assert.match(draft,/oracleRestoreGeneration/,'stale restore completion must not release a newer restore guard');
          assert.match(draft,/restoreOracleDraftExact/,'draft restore must await bridge exact restore when available');
          console.log('Recovery source invariants: PASS');
          NODE
      - name: AI bridge contract
        run: node --test tests/intimacy-ai-bridge-v34.test.mjs
      - name: Supplemental Oracle contract
        run: node tests/intimacy-oracle-ui-v36.test.mjs
      - name: Reading lifecycle invariants
        run: node tests/reading-lifecycle-v59.test.mjs
      - name: INTIMACY Home state regression
        run: node --test tests/intimacy-clean-v39.test.mjs

  webkit-recovery:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Align legacy lifecycle E2E build fixture with this checkout
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          build=json.loads(Path('lunea-build.json').read_text(encoding='utf-8'))['version']
          p=Path('tests/reading-lifecycle-v59.e2e.mjs')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"const BUILD = '[^']+';",f"const BUILD = '{build}';",s,count=1)
          if n != 1:
              raise SystemExit('Could not align reading lifecycle E2E BUILD fixture')
          p.write_text(s,encoding='utf-8')
          print('Aligned lifecycle E2E BUILD to',build)
          PY
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-recovery-audit.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-recovery-audit.log
          exit 1
      - name: Run late-runtime exact-draft regression
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/intimacy-oracle-late-runtime.e2e.mjs
      - name: Run same-session 10-reading mixed-sector regression
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/reading-lifecycle-v59.e2e.mjs
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-recovery-audit.log || true