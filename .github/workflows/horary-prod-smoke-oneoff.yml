name: One-off Horary production smoke

on:
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Pages build and Horary routing source
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://cozysso-afk.github.io/lunea"
          curl -fsSL --retry 3 --retry-delay 2 "$BASE/" -o /tmp/lunea-index.html
          echo "Published cache tokens:"
          grep -oE 'lunea-cache-refresh-v1\.js\?v=[^"]+' /tmp/lunea-index.html | head -1

          TOKEN="$(grep -oE 'lunea-cache-refresh-v1\.js\?v=[^"]+' /tmp/lunea-index.html | head -1 | sed 's/.*?v=//')"
          test -n "$TOKEN"
          echo "published_token=$TOKEN"

          curl -fsSL --retry 3 --retry-delay 2 "$BASE/lunea-astro-request-v1.js?v=$TOKEN" -o /tmp/lunea-astro-request-v1.js

          if grep -Fq "return 'horary'" /tmp/lunea-astro-request-v1.js; then
            echo "::error::Published request owner still routes Horary through jobs"
            exit 1
          fi
          grep -Fq "return 'transit'" /tmp/lunea-astro-request-v1.js
          grep -Fq "return 'return'" /tmp/lunea-astro-request-v1.js
          grep -Fq "Horary stays on the direct /v1/horary fast path" /tmp/lunea-astro-request-v1.js
          echo "Published request owner: Horary direct fast path confirmed"

      - name: Call production V2 Horary directly three times
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/horary-payload.json <<'JSON'
          {
            "question_text": "운영 Horary fast-path smoke test",
            "question_iso": "2026-10-06T18:35:00+09:00",
            "topic": "general",
            "timezone": "Asia/Seoul",
            "place": "여수"
          }
          JSON

          for N in 1 2 3; do
            METRICS="$(curl -sS --retry 2 --retry-delay 2 \
              -o "/tmp/horary-response-$N.json" \
              -w '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}' \
              -X POST 'https://lunea-astro-api-v2.onrender.com/v1/horary' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data-binary @/tmp/horary-payload.json)"

            read -r CODE DNS CONNECT TLS TTFB TOTAL <<<"$METRICS"
            echo "run=$N http=$CODE dns=$DNS connect=$CONNECT tls=$TLS ttfb=$TTFB total=$TOTAL"
            test "$CODE" = "200"

            FILE="/tmp/horary-response-$N.json" python - <<'PY'
          import json, os
          with open(os.environ["FILE"], encoding="utf-8") as f:
              data=json.load(f)
          assert data.get("schema") == "LUNEA_HORARY_V1", data.get("schema")
          assert (data.get("meta") or {}).get("horary_engine") == "LUNEA_HORARY_ENGINE_V5_MOIETY_SECT", (data.get("meta") or {}).get("horary_engine")
          print("schema=", data.get("schema"), "horary_engine=", (data.get("meta") or {}).get("horary_engine"))
          PY
          done

      - name: Call production FULL Horary directly twice
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/horary-full-payload.json <<'JSON'
          {
            "question_text": "운영 Horary FULL comparison smoke test",
            "question_iso": "2026-10-06T18:35:00+09:00",
            "topic": "general",
            "timezone": "Asia/Seoul",
            "place": "여수"
          }
          JSON

          for N in 1 2; do
            METRICS="$(curl -sS --retry 2 --retry-delay 2 \
              -o "/tmp/horary-full-response-$N.json" \
              -w '%{http_code} %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}' \
              -X POST 'https://lunea-astro-api.onrender.com/v1/horary' \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              --data-binary @/tmp/horary-full-payload.json)"

            read -r CODE DNS CONNECT TLS TTFB TOTAL <<<"$METRICS"
            echo "full_run=$N http=$CODE dns=$DNS connect=$CONNECT tls=$TLS ttfb=$TTFB total=$TOTAL"
            test "$CODE" = "200"

            FILE="/tmp/horary-full-response-$N.json" python - <<'PY'
          import json, os
          with open(os.environ["FILE"], encoding="utf-8") as f:
              data=json.load(f)
          assert data.get("schema") == "LUNEA_HORARY_V1", data.get("schema")
          assert (data.get("meta") or {}).get("horary_engine") == "LUNEA_HORARY_ENGINE_V5_MOIETY_SECT", (data.get("meta") or {}).get("horary_engine")
          print("schema=", data.get("schema"), "horary_engine=", (data.get("meta") or {}).get("horary_engine"))
          PY
          done
