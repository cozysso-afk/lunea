name: Test V30 Spread Horary

on:
  push:
    branches: [feature/spread-horary-balance-v30]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check lunea-fixed-spread-depth-v30.js
          node --check lunea-horary-balance-v19.js
          node --check lunea-structural-routing-v4.js
      - name: Full LUNEA regression tests
        run: |
          set -e
          for test in tests/*.test.mjs; do
            echo "==> $test"
            node "$test"
          done
