name: Reading top copy flip logo V34
on:
  push:
    branches: [work/reading-top-copy-flip-logo-20260904]
    paths:
      - tools/patch-reading-top-copy-flip-logo-v34.py
      - tests/reading-top-copy-flip-logo-v34.test.mjs
      - .github/workflows/reading-top-copy-flip-logo-v34.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/reading-top-copy-flip-logo-20260904
          fetch-depth: 0
      - name: Apply UI patch
        run: python3 tools/patch-reading-top-copy-flip-logo-v34.py
      - name: Syntax checks
        run: |
          node --check lunea-reading-action-order-v33.js
          node --check lunea-intimacy-burgundy-v40.js
          node --check lunea-structural-routing-v4.js
      - name: Run requested UI contracts
        run: |
          node --test tests/reading-top-copy-flip-logo-v34.test.mjs
          node tests/thai-range-action-order-v33.test.mjs
      - name: Run related regressions
        run: |
          node --test tests/intimacy-manual-oracle-back-integration.test.mjs
          node --test tests/intimacy-ai-bridge-v34.test.mjs
          node --test tests/manual-category-preservation.test.mjs
      - name: Commit verified runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunea-reading-action-order-v33.js lunea-intimacy-burgundy-v40.js lunea-structural-routing-v4.js tests/thai-range-action-order-v33.test.mjs
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "fix(ui): add top prompt copy and flip-first reading controls"
            git push origin HEAD:work/reading-top-copy-flip-logo-20260904
          fi
