name: Cloud profile V3 patch
on:
  push:
    branches: [audit/lunea-benchmark-v1-20260904]
    paths:
      - tools/patch-cloud-profile-v3.py
      - tests/cloud-profile-reprofiling-v3.test.mjs
      - tests/spread-learning-integration-contract.test.mjs
      - .github/workflows/cloud-profile-v3-patch.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lunea-benchmark-v1-20260904
          fetch-depth: 0
      - name: Apply cloud profile patch
        run: python3 tools/patch-cloud-profile-v3.py
      - name: Syntax checks
        run: |
          node --check lunea-user-spread-learning-v1.js
          node --check lunea-learning-cloud-sync-v1.js
          node --check lunea-structural-routing-v4.js
      - name: Run cloud reprofiling regression
        run: node --test tests/cloud-profile-reprofiling-v3.test.mjs
      - name: Run 20-question benchmark
        run: node tests/lunea-benchmark-question-routing-v1.mjs
      - name: Run learning regressions
        run: |
          node --test tests/spread-learning-v5-runtime.test.mjs
          node --test tests/spread-learning-integration-contract.test.mjs
          node --test tests/manual-category-preservation.test.mjs
          node --test tests/intimacy-manual-oracle-back-integration.test.mjs
          node --test tests/intimacy-ai-bridge-v34.test.mjs
      - name: Commit verified runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lunea-user-spread-learning-v1.js lunea-learning-cloud-sync-v1.js lunea-structural-routing-v4.js
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "fix(learning): reprofile cloud memories with v3 routing"
            git push origin HEAD:audit/lunea-benchmark-v1-20260904
          fi
