name: Run Horary V58 Final Contracts
on: push
permissions:
  contents: write
jobs:
  test-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horary-future-window-save-v58
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align stale V45 loader contract
        run: python - <<'PY'
          from pathlib import Path
          p=Path('tests/horary-ai-stale-guard-v49.test.mjs')
          s=p.read_text().replace('v=451','v=452')
          p.write_text(s)
          PY
      - name: Run Horary contracts
        run: |
          set -e
          node tests/v30-spread-horary-contract.test.mjs
          node tests/horary-question-modes-v37.test.mjs
          node tests/horary-hardening-v38.test.mjs
          node tests/horary-location-button-v39.test.mjs
          node tests/horary-traditional-core-v40.test.mjs
          node tests/horary-balance-guard-v41.test.mjs
          node tests/horary-action-buttons-v43.test.mjs
          node tests/horary-post-actions-v44.test.mjs
          node tests/horary-mobile-actions-v45.test.mjs
          node tests/ai-response-guard-v1.test.mjs
          node tests/horary-ai-stale-guard-v49.test.mjs
          node tests/horary-result-ui-v2.test.mjs
          node tests/horary-ai-explanation-v2.test.mjs
          node tests/horary-interpretation-engine-v47.test.mjs
          node tests/horary-v2-golden-questions.test.mjs
          node tests/horary-answer-validator-v48.test.mjs
          node tests/horary-prashna-cross-v2.test.mjs
          node tests/horary-future-window-save-v58.test.mjs
      - name: Run full test suite
        run: |
          set -e
          for test in tests/*.test.mjs; do
            echo "==> $test"
            node "$test"
          done
      - name: Commit test contract alignment
        run: |
          rm -f .github/workflows/_run-horary-v58-final-contracts.yml
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Horary V58 loader regression contract'
          git push origin HEAD:fix/horary-future-window-save-v58
