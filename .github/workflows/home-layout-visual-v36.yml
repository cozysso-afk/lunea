name: Home Layout and Visual V36

on:
  pull_request:
    paths:
      - 'lunea-home-visual-v36.js'
      - 'lunea-home-portal-v8.js'
      - 'lunea-mobile-interaction-hotfix-v1.js'
      - 'lunea-meihua-v1.js'
      - 'lunea-meihua-ui-final-v2.js'
      - 'lunea-lenormand-v1.js'
      - 'lunea-thai-standalone-v24.js'
      - 'lunea-message-oracle-home-v1.js'
      - 'lunea-intimacy-clean-v39.js'
      - 'lunea-cache-refresh-v1.js'
      - 'lunea-sector-color-system-v28.js'
      - 'tests/home-layout-visual-v36.*.mjs'
      - '.github/workflows/home-layout-visual-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  home-layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify single-owner and visual contracts
        run: node tests/home-layout-visual-v36.test.mjs
      - name: Syntax check WebKit scenario
        run: node --check tests/home-layout-visual-v36.e2e.mjs

  home-layout-iphone-webkit:
    needs: home-layout-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-home-v36-http.log 2>&1 &
          echo $! >/tmp/lunea-home-v36-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-home-v36-http.log
          exit 1
      - name: Run iPhone WebKit lifecycle regression
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/home-layout-visual-v36.e2e.mjs
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-home-v36-http.log || true
