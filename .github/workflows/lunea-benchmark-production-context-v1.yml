name: LUNEA benchmark production context v1
on:
  push:
    branches:
      - audit/lunea-benchmark-v1-20260904
    paths:
      - '.github/workflows/lunea-benchmark-production-context-v1.yml'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject actual sector context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/lunea-benchmark-question-routing-v1.mjs')
          s=p.read_text()
          for marker in [
            "name:'단순 감정'", "name:'감정↔행동'", "name:'조건부 연락'", "name:'두 사람 감정 비교'", "name:'비선택 대칭 인식'",
            "name:'연락 중단 원인'", "name:'사후 사건 인식'", "name:'관계 변화 시기'", "name:'YES/NO 연락 시기'", "name:'1인 다중 시나리오'",
            "name:'장문 복합 관계'", "name:'A/B 복합 대칭'", "name:'무행동 조건 관계'", "name:'극장문 스트레스'"
          ]:
            i=s.find(marker)
            if i<0: continue
            j=s.find('}',i)
            chunk=s[i:j]
            if "category:'" not in chunk:
              s=s[:j]+",category:'LOVE'"+s[j:]
          for marker,cat in [("name:'커리어 선택 비교'",'CAREER'),("name:'시험 병목'",'CAREER'),("name:'투자 근거/반증'",'STOCK')]:
            i=s.find(marker); j=s.find('}',i); chunk=s[i:j]
            if i>=0 and "category:'" not in chunk: s=s[:j]+f",category:'{cat}'"+s[j:]
          p.write_text(s)
          PY
      - name: Run production-context benchmark
        run: node tests/lunea-benchmark-question-routing-v1.mjs
