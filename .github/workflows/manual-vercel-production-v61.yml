name: Manual Vercel Production V61
on:
  push:
    branches:
      - ops/deploy-reading-draw-v61
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_DP2P7c6eO9oAhBlIY2CyEZB2
      VERCEL_PROJECT_ID: prj_slPiengYUlX6senuHbG2gvAGP9xY
    steps:
      - uses: actions/checkout@v4
      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN secret is missing'; exit 2; }
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
