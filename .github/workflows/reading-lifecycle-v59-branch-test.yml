name: Reading lifecycle V59 branch checks

on:
  push:
    branches:
      - fix/reading-lifecycle-entry-init-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check changed runtime files
        run: |
          node --check lunea-reading-lifecycle-v59.js
          node --check lunea-reading-boundary-reset-v31.js
          node --check lunea-runtime-state-v56.js
          node --check lunea-reading-polish-v14.js
          node --check lunea-thai-archive-timing-isolation-v27.js
          node --check lunea-mobile-runtime-fixes-v57.js
          node --check lunea-universal-ai-opal-v20.js
          node --check lunea-learning-success-gate-v1.js
          node --check lunea-manual-structure-v1.js
          node --check lunea-manual-everywhere-v1.js
          node --check lunea-manual-limit20-v17.js
          node --check lunea-lag-guard-v1.js
          node --check lunea-intimacy-oracle-ui-v36.js
          node --check lunea-boot-reveal-v29.js
          node --check lunea-cache-refresh-v1.js
      - name: Source invariant regression test
        run: node tests/reading-lifecycle-v59.test.mjs
