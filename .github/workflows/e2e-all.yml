name: E2E all (WebKit, iPhone)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    name: diag ${{ matrix.variant }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: diag-webkit-crash
            images: 'original'
            variant: 'baseline'
            block: ''
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'block-12-again'
            block: 'astro-return-v1.js,lunea-manual-structure-v1.js,lunea-reading-flow-v5.js,lunea-category-art-v10.js,lunea-daily-celestial-v22.js,lunea-transit-request-v1.js,lunea-horary-mobile-stability-v42.js,lunea-thai-archive-timing-isolation-v27.js,lunea-horary-interpretation-bridge-v47.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-astro-return-v1'
            block: 'astro-return-v1.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-manual-structure-v1'
            block: 'lunea-manual-structure-v1.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-reading-flow-v5'
            block: 'lunea-reading-flow-v5.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-category-art-v10'
            block: 'lunea-category-art-v10.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-daily-celestial-v22'
            block: 'lunea-daily-celestial-v22.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-transit-request-v1'
            block: 'lunea-transit-request-v1.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-horary-mobile-stability-v42'
            block: 'lunea-horary-mobile-stability-v42.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-thai-archive-timing-isolation-v27'
            block: 'lunea-thai-archive-timing-isolation-v27.js'
            nocv: '0'
          - test: diag-webkit-crash
            images: 'original'
            variant: 'only-lunea-horary-interpretation-bridge-v47'
            block: 'lunea-horary-interpretation-bridge-v47.js'
            nocv: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Experiment - downscale images (long side 1500)
        if: matrix.images == 'downscaled'
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import glob,os
          from PIL import Image
          n=0
          for p in glob.glob('**/*',recursive=True):
            if not p.lower().endswith(('.png','.jpg','.jpeg','.webp')) or not os.path.isfile(p): continue
            try:
              im=Image.open(p)
              if max(im.size)<=1500: continue
              r=1500/max(im.size); im=im.resize((round(im.size[0]*r),round(im.size[1]*r)),Image.LANCZOS)
              im.save(p); n+=1
            except Exception as e: print('skip',p,e)
          print('downscaled',n)
          PY
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run ${{ matrix.test }} ${{ matrix.variant }}
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
          LUNEA_DIAG_BLOCK: ${{ matrix.block }}
          LUNEA_DIAG_NO_CV: ${{ matrix.nocv }}
          LUNEA_DIAG_FLOW: sectors
        run: node tests/${{ matrix.test }}.e2e.mjs
