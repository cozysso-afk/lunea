name: E2E all (WebKit, iPhone)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    name: diag ${{ matrix.variant }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: diag-webkit-crash
            variant: 'baseline'
            drop: ''
          - test: diag-webkit-crash
            variant: 'drop-0-11'
            drop: '0-11'
          - test: diag-webkit-crash
            variant: 'drop-11-22'
            drop: '11-22'
          - test: diag-webkit-crash
            variant: 'drop-22-33'
            drop: '22-33'
          - test: diag-webkit-crash
            variant: 'drop-33-44'
            drop: '33-44'
          - test: diag-webkit-crash
            variant: 'drop-44-55'
            drop: '44-55'
          - test: diag-webkit-crash
            variant: 'drop-55-66'
            drop: '55-66'
          - test: diag-webkit-crash
            variant: 'drop-66-77'
            drop: '66-77'
          - test: diag-webkit-crash
            variant: 'drop-77-88'
            drop: '77-88'
          - test: diag-webkit-crash
            variant: 'drop-88-89'
            drop: '88-89'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run ${{ matrix.test }}
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
          LUNEA_DIAG_CSS_DROP: ${{ matrix.drop }}
          LUNEA_DIAG_FLOW: sectors
        run: node tests/${{ matrix.test }}.e2e.mjs
