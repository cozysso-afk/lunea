name: E2E all (WebKit, iPhone)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - ab24-mobile-preview
          - balanced-interpretation
          - cardback-first-frame
          - daily-message-draft-prompt
          - home-layout-visual-v36
          - intimacy-oracle-extra-v365
          - intimacy-oracle-late-runtime
          - journal-validation-mobile-v4
          - lenormand-v1
          - meihua-v1
          - message-oracle-persistence
          - oracle-ui-regressions
          - reading-lifecycle-v59
          - system-support-lifecycle-v1
          - tarot-local-faces
          - timing-oracle-session-artwork
        images: [original]
        include:
          - test: diag-webkit-crash
            images: original
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Experiment - downscale images (long side 1500)
        if: matrix.images == 'downscaled'
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import glob,os
          from PIL import Image
          n=0
          for p in glob.glob('**/*',recursive=True):
            if not p.lower().endswith(('.png','.jpg','.jpeg','.webp')) or not os.path.isfile(p): continue
            try:
              im=Image.open(p)
              if max(im.size)<=1500: continue
              r=1500/max(im.size); im=im.resize((round(im.size[0]*r),round(im.size[1]*r)),Image.LANCZOS)
              im.save(p); n+=1
            except Exception as e: print('skip',p,e)
          print('downscaled',n)
          PY
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run ${{ matrix.test }}
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/${{ matrix.test }}.e2e.mjs
