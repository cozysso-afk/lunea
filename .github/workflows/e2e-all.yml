name: E2E all (WebKit, iPhone)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    name: diag ${{ matrix.variant }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: diag-webkit-crash
            variant: 'original-0'
            block: ''
            images: 'original'
          - test: diag-webkit-crash
            variant: 'downscaled-0'
            block: ''
            images: 'downscaled'
          - test: diag-webkit-crash
            variant: 'original-1'
            block: ''
            images: 'original'
          - test: diag-webkit-crash
            variant: 'downscaled-1'
            block: ''
            images: 'downscaled'
          - test: diag-webkit-crash
            variant: 'original-2'
            block: ''
            images: 'original'
          - test: diag-webkit-crash
            variant: 'downscaled-2'
            block: ''
            images: 'downscaled'
          - test: diag-webkit-crash
            variant: 'original-3'
            block: ''
            images: 'original'
          - test: diag-webkit-crash
            variant: 'downscaled-3'
            block: ''
            images: 'downscaled'
          - test: diag-webkit-crash
            variant: 'original-4'
            block: ''
            images: 'original'
          - test: diag-webkit-crash
            variant: 'downscaled-4'
            block: ''
            images: 'downscaled'
          - test: diag-webkit-crash
            variant: 'original-5'
            block: ''
            images: 'original'
          - test: diag-webkit-crash
            variant: 'downscaled-5'
            block: ''
            images: 'downscaled'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps webkit chromium
      - name: Downscale images (long side 1200)
        if: matrix.images == 'downscaled'
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import glob,os
          from PIL import Image
          n=0
          for p in glob.glob('**/*',recursive=True):
            if not p.lower().endswith(('.png','.jpg','.jpeg','.webp')) or not os.path.isfile(p): continue
            try:
              im=Image.open(p)
              if max(im.size)<=1200: continue
              r=1200/max(im.size); im.resize((round(im.size[0]*r),round(im.size[1]*r)),Image.LANCZOS).save(p); n+=1
            except Exception as e: print('skip',p,e)
          print('downscaled',n)
          PY
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run ${{ matrix.test }}
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
          LUNEA_DIAG_BLOCK: ${{ matrix.block }}
          LUNEA_DIAG_FLOW: sectors-reveal
        run: node tests/${{ matrix.test }}.e2e.mjs
