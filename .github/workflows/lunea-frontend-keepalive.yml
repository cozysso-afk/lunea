name: LUNEA Frontend Keepalive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lunea-frontend-keepalive.yml'
  schedule:
    # Render Free sleeps after ~15 minutes idle. Five-minute pings leave enough
    # margin for delayed GitHub scheduled runs and keep the existing Render URL
    # warm without touching the production deploy branch.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunea-frontend-keepalive
  cancel-in-progress: true

jobs:
  wake-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Keep LUNEA Render frontend awake
        shell: bash
        run: |
          set -u
          BASE='https://lunea-v41-web.onrender.com'
          HEALTH="${BASE}/__lunea_bypass_health"

          # A single inbound request is enough to reset Render's idle timer once
          # the service is up. If it happened to be asleep, keep retrying until
          # the real Node process answers so the next scheduled ping starts from
          # a warm instance.
          for attempt in $(seq 1 16); do
            stamp="$(date +%s)"
            body="$(curl -L --silent --show-error --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -H 'User-Agent: LUNEA-Frontend-Keepalive/2' \
              "${HEALTH}?keepalive=${stamp}" 2>/dev/null || true)"

            if printf '%s' "$body" | grep -q '"ok":true'; then
              # Touch the canonical root as well so Render records ordinary app
              # traffic in addition to the health request.
              curl -L --silent --output /dev/null --connect-timeout 10 --max-time 20 \
                -H 'Cache-Control: no-cache' \
                -H 'User-Agent: LUNEA-Frontend-Keepalive/2' \
                "${BASE}/?keepalive=${stamp}" || true
              echo "LUNEA frontend warm (attempt ${attempt})."
              exit 0
            fi

            echo "Frontend waking (attempt ${attempt}/16)."
            sleep 8
          done

          echo 'LUNEA frontend did not become ready during keepalive window.' >&2
          exit 1
