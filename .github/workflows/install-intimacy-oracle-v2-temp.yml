name: Install INTIMACY Oracle V2 assets (temporary)

on:
  push:
    branches:
      - work/intimacy-oracle-v2-assets-ui-20260905

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[oracle-v2-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/intimacy-oracle-v2-assets-ui-20260905
          fetch-depth: 0
      - name: Extract uploaded web-optimized Oracle deck
        run: |
          set -euo pipefail
          test -f lunea_intimacy_oracle_web_optimized_under25mb.zip
          rm -rf /tmp/lunea-oracle-v2
          mkdir -p /tmp/lunea-oracle-v2 assets/intimacy-oracle/cards
          unzip -q lunea_intimacy_oracle_web_optimized_under25mb.zip -d /tmp/lunea-oracle-v2
          for n in $(seq -w 1 36); do
            test -f "/tmp/lunea-oracle-v2/oracle_${n}.png"
            cp "/tmp/lunea-oracle-v2/oracle_${n}.png" "assets/intimacy-oracle/cards/oracle_${n}.png"
          done
          test -f /tmp/lunea-oracle-v2/oracle_back_new.png
          cp /tmp/lunea-oracle-v2/oracle_back_new.png assets/intimacy-oracle/oracle_back_v2.png
      - name: Commit extracted assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/intimacy-oracle/cards assets/intimacy-oracle/oracle_back_v2.png
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'chore(intimacy): install uploaded Oracle v2 assets [oracle-v2-assets]'
          git push origin HEAD:work/intimacy-oracle-v2-assets-ui-20260905
