name: INTIMACY V45 root repair
on:
  push:
    branches: [work/intimacy-visual-assets-v45-20260904]
    paths: ['.github/workflows/intimacy-v45-root-fix.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install image tooling
        run: python -m pip install --quiet pillow numpy
      - name: Apply deterministic repair
        run: python scripts/intimacy_v45_root_fix.py
      - name: Validate runtime and normalized assets
        shell: bash
        run: |
          set -euo pipefail
          node --check lunea-cardback-restore-v19.js
          node --check lunea-ios-performance-v3.js
          node --check lunea-intimacy-burgundy-v40.js
          node --check lunea-intimacy-readability-v36.js
          node --check lunea-intimacy-clean-v39.js
          node --check lunea-intimacy-oracle-ui-v36.js
          node tests/intimacy-v45-root-regression.test.mjs
          node tests/intimacy-readability-v36.test.mjs
          node tests/intimacy-clean-v39.test.mjs
          node tests/intimacy-visual-cohesion-v44.test.mjs
          node tests/intimacy-manual-oracle-back-integration.test.mjs
          node tests/intimacy-oracle-ui-v36.test.mjs
          node tests/intimacy-tarot-visual-v40.test.mjs
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import numpy as np, statistics
          root=Path('assets/intimacy-oracle/cards')
          lums=[]; sats=[]
          for i in range(1,37):
              p=root/f'oracle_{i:02d}.png'
              im=Image.open(p).convert('RGB')
              assert im.size==(150,250), (p,im.size)
              a=np.asarray(im).astype(np.float32)/255.0
              c=a[15:235,9:141]
              lum=.2126*c[:,:,0]+.7152*c[:,:,1]+.0722*c[:,:,2]
              mx=c.max(2); mn=c.min(2)
              sat=np.divide(mx-mn,mx,out=np.zeros_like(mx),where=mx>1e-6)
              lums.append(float(lum.mean())); sats.append(float(sat.mean()))
          print('oracle luminance range',min(lums),max(lums),'sd',statistics.pstdev(lums))
          print('oracle saturation sd',statistics.pstdev(sats))
          assert statistics.pstdev(lums) < .012
          assert statistics.pstdev(sats) < .04
          assert min(lums) > .11 and max(lums) < .17
          PY
      - name: Commit repaired runtime and normalized cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lunea-cardback-restore-v19.js lunea-ios-performance-v3.js lunea-intimacy-burgundy-v40.js lunea-intimacy-readability-v36.js lunea-intimacy-clean-v39.js lunea-intimacy-oracle-ui-v36.js tests/intimacy-v45-root-regression.test.mjs tests/intimacy-readability-v36.test.mjs tests/intimacy-clean-v39.test.mjs tests/intimacy-visual-cohesion-v44.test.mjs assets/intimacy-oracle/cards/oracle_*.png
          git commit -m 'fix(intimacy): remove general-back flash and normalize Oracle art'
          git push origin HEAD:work/intimacy-visual-assets-v45-20260904