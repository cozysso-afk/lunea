name: Test Daily Message Draft E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'lunea-daily-*.js'
      - 'lunea-message-oracle-*.js'
      - 'lunea-reading-attachments-v1.js'
      - 'lunea-reading-draft-v1.js'
      - 'lunea-final-prompt-priority-v1.js'
      - 'lunea-structural-routing-v4.js'
      - 'lunea-cache-refresh-v1.js'
      - 'tests/daily-message-draft-prompt-regression.test.mjs'
      - 'tests/daily-message-draft-prompt.e2e.mjs'
      - '.github/workflows/test-daily-message-draft-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-message-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check lunea-reading-attachments-v1.js
          node --check lunea-reading-draft-v1.js
          node --check lunea-message-oracle-support-v1.js
          node --check lunea-final-prompt-priority-v1.js
          node --check lunea-daily-orbit6-v21.js
          node --check tests/daily-message-draft-prompt.e2e.mjs
      - name: Existing source regression
        run: node tests/daily-message-draft-prompt-regression.test.mjs

  daily-message-webkit:
    needs: daily-message-source
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-http.log 2>&1 &
          echo $! >/tmp/lunea-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-http.log
          exit 1
      - name: Run Daily + Message Oracle exact-draft E2E
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/daily-message-draft-prompt.e2e.mjs
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-http.log || true
