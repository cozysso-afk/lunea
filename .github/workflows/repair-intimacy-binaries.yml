name: Repair INTIMACY binaries

on:
  push:
    branches: [work/intimacy-final-assets-20260903]
    paths: ['.github/workflows/repair-intimacy-binaries.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download transferred artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/intimacy-oracle
          curl -fL --retry 2 'https://drive.google.com/uc?export=download&id=1N62OZTszNEQ_7IGhwYjFu4ihnogYJZNT' -o assets/intimacy-oracle/back_intimacy_final.jpg
          curl -fL --retry 2 'https://drive.google.com/uc?export=download&id=1-OsEfKLXXfT9z6ZuX3tussZwg7p3l99Z' -o assets/intimacy-oracle/intimacy_sector_final.jpg
          curl -fL --retry 2 'https://drive.google.com/uc?export=download&id=1_Ig4SSBjK8Y0gd0BRfLp00WMz5eyBVfa' -o assets/intimacy-oracle/oracle_atlas_final.jpg
      - name: Validate real JPEG bytes
        shell: python
        run: |
          from pathlib import Path
          expected = {
            'assets/intimacy-oracle/back_intimacy_final.jpg': 100000,
            'assets/intimacy-oracle/intimacy_sector_final.jpg': 50000,
            'assets/intimacy-oracle/oracle_atlas_final.jpg': 300000,
          }
          for name, minimum in expected.items():
              data = Path(name).read_bytes()
              assert data[:3] == b'\xff\xd8\xff', (name, data[:3])
              assert len(data) >= minimum, (name, len(data))
              print(name, len(data), data[:3].hex())
      - name: Commit repaired binaries and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/intimacy-oracle/back_intimacy_final.jpg assets/intimacy-oracle/intimacy_sector_final.jpg assets/intimacy-oracle/oracle_atlas_final.jpg
          git rm .github/workflows/repair-intimacy-binaries.yml
          git commit -m 'fix(intimacy): restore valid final artwork binaries'
          git push origin HEAD:work/intimacy-final-assets-20260903
