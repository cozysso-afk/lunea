name: INTIMACY visual cohesion hotfix
on:
  push:
    branches: [work/intimacy-manual-oracle-backfix-20260904]
    paths: ['.github/workflows/intimacy-visual-cohesion-hotfix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch INTIMACY visual ownership
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'missing in {path}: {old[:110]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Sector-color system: INTIMACY must not normalize to GENERAL/mint.
          r('lunea-sector-color-system-v28.js', "const SECTORS = ['general','career','love','stock','timing','horary','daily','thai'];", "const SECTORS = ['general','career','love','stock','timing','horary','daily','thai','intimacy'];")
          r('lunea-sector-color-system-v28.js', "    if (/stock|trading|주식|매수|매도/.test(s)) return 'stock';\n    if (/love|heart|연애|재회|관계|속마음/.test(s)) return 'love';", "    if (/stock|trading|주식|매수|매도/.test(s)) return 'stock';\n    if (/intimacy|속궁합|친밀감|신체적\\s*궁합|성적\\s*(?:궁합|끌림)/.test(s)) return 'intimacy';\n    if (/love|heart|연애|재회|관계|속마음/.test(s)) return 'love';")
          r('lunea-sector-color-system-v28.js', "      [data-lunea-sector=\"love\"]{--sec-rgb:255,145,191;--sec2-rgb:190,153,242;--sec-text:#ffdceb}\n      [data-lunea-sector=\"stock\"]", "      [data-lunea-sector=\"love\"]{--sec-rgb:255,145,191;--sec2-rgb:190,153,242;--sec-text:#ffdceb}\n      [data-lunea-sector=\"intimacy\"]{--sec-rgb:211,91,139;--sec2-rgb:119,41,82;--sec-text:#ffe6ef}\n      [data-lunea-sector=\"stock\"]")

          # V40: crop intrinsic white margins, keep lower/detail icon synced, own reading colors.
          r('lunea-intimacy-burgundy-v40.js', "/* LUNEA INTIMACY burgundy cabinet + tarot skin V40.2 */", "/* LUNEA INTIMACY burgundy cabinet + tarot skin V40.4 */")
          r('lunea-intimacy-burgundy-v40.js', "const RELEASE = '40.3';", "const RELEASE = '40.4';")
          r('lunea-intimacy-burgundy-v40.js', "        background:#310b20!important;border-color:rgba(250,176,202,.38)!important;", "        background:#310b20!important;border-color:rgba(250,176,202,.38)!important;overflow:hidden!important;")
          r('lunea-intimacy-burgundy-v40.js', "        width:100%!important;height:100%!important;display:block!important;object-fit:cover!important;\n        border-radius:inherit!important;pointer-events:none!important", "        width:100%!important;height:100%!important;display:block!important;object-fit:cover!important;object-position:center!important;\n        transform:scale(1.20)!important;transform-origin:center!important;\n        border-radius:inherit!important;pointer-events:none!important")
          r('lunea-intimacy-burgundy-v40.js', "        background:#310b20 url('${ICON_SRC}') center/cover no-repeat!important;\n        border-color:rgba(247,170,199,.34)!important;", "        background:#310b20!important;overflow:hidden!important;\n        border-color:rgba(247,170,199,.34)!important;")
          r('lunea-intimacy-burgundy-v40.js', "        width:100%!important;height:100%!important;display:block!important;object-fit:cover!important;\n        border-radius:inherit!important;pointer-events:none!important\n      }\n      .lunea-intimacy-category .cat-text h3", "        width:100%!important;height:100%!important;display:block!important;object-fit:cover!important;object-position:center!important;\n        transform:scale(1.20)!important;transform-origin:center!important;\n        border-radius:inherit!important;pointer-events:none!important\n      }\n      .lunea-intimacy-category .cat-text h3")

          # Explicitly override the generic opal/mint reading polish while INTIMACY is active.
          marker = "      #cards .tarot-card-wrapper.lunea-intimacy-tarot-card .tarot-card{"
          block = """      body.lunea-intimacy-reading #sheet[data-lunea-sector=\"intimacy\"]{\n        border-top-color:rgba(225,117,160,.34)!important;\n        background:radial-gradient(circle at 8% 0%,rgba(176,45,94,.20),transparent 31%),radial-gradient(circle at 100% 10%,rgba(116,36,84,.13),transparent 34%),linear-gradient(176deg,#1b0d19 0%,#0c0912 74%)!important;\n      }\n      body.lunea-intimacy-reading #spreadOverlay .modal{\n        border-color:rgba(224,120,162,.25)!important;\n        background:radial-gradient(circle at 13% 0%,rgba(173,43,91,.16),transparent 29%),radial-gradient(circle at 96% 23%,rgba(120,42,87,.11),transparent 32%),linear-gradient(168deg,rgba(25,12,24,.99),rgba(7,7,14,.995))!important;\n      }\n      body.lunea-intimacy-reading #spreadOverlay #cards{\n        border-color:rgba(222,126,164,.16)!important;\n        background:radial-gradient(ellipse at 50% 12%,rgba(137,31,74,.13),transparent 38%),linear-gradient(180deg,rgba(64,14,38,.16),rgba(11,8,16,.32))!important;\n        box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 16px 34px rgba(0,0,0,.24)!important;\n      }\n      body.lunea-intimacy-reading #spreadOverlay .actionbar{\n        border-color:rgba(224,126,164,.20)!important;\n        background:radial-gradient(circle at 10% -12%,rgba(181,56,106,.15),transparent 34%),radial-gradient(circle at 94% 110%,rgba(111,39,82,.12),transparent 38%),linear-gradient(150deg,rgba(46,17,35,.96),rgba(11,9,18,.98))!important;\n        box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 34px rgba(0,0,0,.34),0 0 24px rgba(151,42,87,.07)!important;\n      }\n      body.lunea-intimacy-reading #spreadOverlay .actionbar .mini,\n      body.lunea-intimacy-reading #spreadOverlay .actionbar #aiRead,\n      body.lunea-intimacy-reading #spreadOverlay .actionbar #extraCard{\n        color:#f8edf2!important;border-color:rgba(225,132,168,.22)!important;\n        background:linear-gradient(145deg,rgba(112,34,69,.16),rgba(67,22,55,.09))!important;\n        box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 10px rgba(0,0,0,.12)!important;\n      }\n\n"""
          p=Path('lunea-intimacy-burgundy-v40.js'); s=p.read_text(encoding='utf-8')
          if marker not in s: raise SystemExit('missing V40 tarot style marker')
          p.write_text(s.replace(marker,block+marker,1),encoding='utf-8')

          # Persist icon correction after the old 12s retry window expires.
          r('lunea-intimacy-burgundy-v40.js', "  function boot() {\n    apply();", "  function observeUi() {\n    if (document.body?.__luneaIntimacyV404UiObserved) return;\n    document.body.__luneaIntimacyV404UiObserved = true;\n    let queued = false;\n    new MutationObserver(() => {\n      if (queued) return;\n      queued = true;\n      requestAnimationFrame(() => { queued = false; apply(); });\n    }).observe(document.body, {childList:true,subtree:true});\n    document.addEventListener('click', event => {\n      if (event.target?.closest?.('[data-key=\"intimacy\"],.lunea-intimacy-category')) [0,80,240].forEach(ms => setTimeout(apply,ms));\n    }, true);\n  }\n\n  function boot() {\n    apply();\n    observeUi();")

          # Oracle area: retain burgundy identity but lift crushed blacks/labels.
          r('lunea-intimacy-oracle-ui-v36.js', ".lio-panel{margin:12px 0 4px}", ".lio-panel{margin:12px 0 4px;padding:10px;border:1px solid rgba(221,126,164,.17);border-radius:14px;background:linear-gradient(160deg,rgba(74,18,43,.22),rgba(24,9,20,.42))}")
          r('lunea-intimacy-oracle-ui-v36.js', ".lio-card{position:relative;min-width:0;padding:0;border:0;background:#12080d;border-radius:10px;overflow:hidden;aspect-ratio:3/5;box-shadow:0 5px 18px #0008}", ".lio-card{position:relative;min-width:0;padding:0;border:1px solid rgba(224,139,171,.30);background:#28101b;border-radius:10px;overflow:hidden;aspect-ratio:3/5;box-shadow:0 5px 18px rgba(0,0,0,.52),0 0 16px rgba(154,50,91,.07)}")
          r('lunea-intimacy-oracle-ui-v36.js', ".lio-card-face{position:absolute;inset:0;background-repeat:no-repeat}", ".lio-card-face{position:absolute;inset:0;background-repeat:no-repeat;filter:brightness(1.12) saturate(1.06)}")
          r('lunea-intimacy-oracle-ui-v36.js', ".lio-card span{position:absolute;inset:auto 4px 5px;padding:5px 4px;background:#090609d6;", ".lio-card span{position:absolute;inset:auto 4px 5px;padding:5px 4px;background:rgba(31,8,18,.64);backdrop-filter:blur(5px);")

          # Update V40 version contract.
          p=Path('tests/intimacy-tarot-visual-v40.test.mjs'); s=p.read_text(encoding='utf-8').replace("/const RELEASE = '40\\.3'/","/const RELEASE = '40\\.4'/").replace('__luneaIntimacyV403Wrapped','__luneaIntimacyV404Wrapped'); p.write_text(s,encoding='utf-8')
          # Runtime marker follows the release.
          p=Path('lunea-intimacy-burgundy-v40.js'); s=p.read_text(encoding='utf-8').replace('__luneaIntimacyV403Wrapped','__luneaIntimacyV404Wrapped').replace('__luneaIntimacyV403Observed','__luneaIntimacyV404Observed'); p.write_text(s,encoding='utf-8')
          PY
      - name: Add visual regression contract
        shell: bash
        run: |
          cat > tests/intimacy-visual-cohesion-v44.test.mjs <<'EOF'
          import test from 'node:test'; import assert from 'node:assert/strict'; import fs from 'node:fs';
          const read=n=>fs.readFileSync(new URL(`../${n}`,import.meta.url),'utf8');
          const sector=read('lunea-sector-color-system-v28.js'), burgundy=read('lunea-intimacy-burgundy-v40.js'), oracle=read('lunea-intimacy-oracle-ui-v36.js');
          test('INTIMACY owns a burgundy sector instead of GENERAL mint',()=>{assert.match(sector,/SECTORS[^\n]+intimacy/);assert.match(sector,/return 'intimacy'/);assert.match(sector,/data-lunea-sector=\"intimacy\"/);assert.match(sector,/--sec-rgb:211,91,139/)});
          test('sector art is zoom-cropped and late icons stay synchronized',()=>{assert.match(burgundy,/transform:scale\(1\.20\)/);assert.match(burgundy,/function observeUi\(\)/);assert.match(burgundy,/MutationObserver/);assert.match(burgundy,/const RELEASE = '40\.4'/)});
          test('reading chrome overrides opal mint while INTIMACY is active',()=>{assert.match(burgundy,/body\.lunea-intimacy-reading #spreadOverlay \.actionbar/);assert.match(burgundy,/body\.lunea-intimacy-reading #sheet\[data-lunea-sector=\"intimacy\"\]/)});
          test('Oracle panel lifts black levels without changing art assets',()=>{assert.match(oracle,/brightness\(1\.12\)/);assert.match(oracle,/rgba\(31,8,18,\.64\)/);assert.match(oracle,/oracle_back_intimacy_final\.png/)});
          EOF
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check lunea-sector-color-system-v28.js
          node --check lunea-intimacy-burgundy-v40.js
          node --check lunea-intimacy-oracle-ui-v36.js
          node tests/intimacy-visual-cohesion-v44.test.mjs
          node tests/intimacy-manual-oracle-back-integration.test.mjs
          node tests/manual-category-preservation.test.mjs
          node tests/intimacy-tarot-visual-v40.test.mjs
          node tests/intimacy-oracle-ui-v36.test.mjs
          node tests/intimacy-ai-bridge-v34.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lunea-sector-color-system-v28.js lunea-intimacy-burgundy-v40.js lunea-intimacy-oracle-ui-v36.js tests/intimacy-visual-cohesion-v44.test.mjs tests/intimacy-tarot-visual-v40.test.mjs
          git commit -m 'fix(intimacy): unify burgundy theme and crop sector art'
          git push origin HEAD:work/intimacy-manual-oracle-backfix-20260904
