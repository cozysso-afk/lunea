name: Validate INTIMACY Repair

on:
  push:
    branches:
      - work/intimacy-repair-20260904
    paths:
      - '.github/workflows/unpack-intimacy-oracle-assets.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
      - name: Validate final PNG assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          sig = bytes([0x89,0x50,0x4e,0x47,0x0d,0x0a,0x1a,0x0a])
          fixed = {
              Path('assets/intimacy-oracle/oracle_back_intimacy_final.png'): 100_000,
              Path('assets/intimacy-oracle/tarot_back_intimacy_final.png'): 100_000,
              Path('assets/intimacy-oracle/intimacy_sector_final.png'): 100_000,
          }
          for p, minimum in fixed.items():
              data = p.read_bytes()
              assert data[:8] == sig, f'{p} must be PNG'
              assert len(data) > minimum, f'{p} unexpectedly small: {len(data)}'
          cards = sorted(Path('assets/intimacy-oracle/cards').glob('oracle_*.png'))
          expected = [f'oracle_{i:02d}.png' for i in range(1,37)]
          assert [p.name for p in cards] == expected, f'Oracle set mismatch: {[p.name for p in cards]}'
          for p in cards:
              data = p.read_bytes()
              assert data[:8] == sig, f'{p} must be PNG'
              assert len(data) > 5_000, f'{p} unexpectedly small: {len(data)}'
          print('PNG assets: PASS')
          PY
      - name: Syntax-check changed runtime files
        shell: bash
        run: |
          set -euo pipefail
          node --check lunea-intimacy-ai-bridge-v34.js
          node --check lunea-intimacy-burgundy-v40.js
          node --check lunea-intimacy-oracle-v35.js
          node --check lunea-intimacy-oracle-ui-v36.js
          node --check lunea-intimacy-repair-v43.js
          node --check lunea-reading-action-order-v33.js
      - name: Run INTIMACY regression tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/intimacy-oracle-v35.test.mjs
          node tests/intimacy-oracle-ui-v36.test.mjs
          node tests/intimacy-asset-routing-v43.test.mjs
          node tests/intimacy-burgundy-v40.test.mjs
          node tests/intimacy-tarot-visual-v40.test.mjs
          node tests/intimacy-ai-bridge-v34.test.mjs
          node tests/intimacy-readability-v36.test.mjs
          node tests/intimacy-clean-v39.test.mjs
# final predeploy rerun after loader-test repair
