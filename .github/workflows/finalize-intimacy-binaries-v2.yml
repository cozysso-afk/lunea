name: Finalize INTIMACY binaries v2

on:
  push:
    branches: [work/intimacy-final-assets-20260903]
    paths: ['.github/workflows/finalize-intimacy-binaries-v2.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/intimacy-oracle
          curl -fL --retry 4 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1N62OZTszNEQ_7IGhwYjFu4ihnogYJZNT' -o assets/intimacy-oracle/back_intimacy_final.jpg
          curl -fL --retry 4 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1-OsEfKLXXfT9z6ZuX3tussZwg7p3l99Z' -o assets/intimacy-oracle/intimacy_sector_final.jpg
          curl -fL --retry 4 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1_Ig4SSBjK8Y0gd0BRfLp00WMz5eyBVfa' -o assets/intimacy-oracle/oracle_atlas_final.jpg
      - name: Validate exact original bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          expected = {
            'assets/intimacy-oracle/back_intimacy_final.jpg': (141583, 'd06cd37f08dee24201bbd8d513b9e88da0d6ff11cf7636344f120e406890fddb'),
            'assets/intimacy-oracle/intimacy_sector_final.jpg': (57299, 'f6da0f1161343ca93a5947db596cb03a16e084cf2de01d8e61de27b3feaacd4a'),
            'assets/intimacy-oracle/oracle_atlas_final.jpg': (344645, '1551c2911ece7e2e9f08e14e4712561172569297eb5919a8ad3310d7005c6092'),
          }
          for name, (size, digest) in expected.items():
              data = Path(name).read_bytes()
              assert len(data) == size, (name, len(data), size)
              assert data[:3] == b'\xff\xd8\xff', (name, data[:3])
              assert data[-2:] == b'\xff\xd9', (name, data[-2:])
              actual = hashlib.sha256(data).hexdigest()
              assert actual == digest, (name, actual, digest)
              print(name, len(data), actual)
      - name: Commit exact binaries and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/intimacy-oracle/back_intimacy_final.jpg assets/intimacy-oracle/intimacy_sector_final.jpg assets/intimacy-oracle/oracle_atlas_final.jpg
          git rm .github/workflows/finalize-intimacy-binaries-v2.yml
          git commit -m 'fix(intimacy): commit exact verified final artwork binaries'
          git push origin HEAD:work/intimacy-final-assets-20260903
