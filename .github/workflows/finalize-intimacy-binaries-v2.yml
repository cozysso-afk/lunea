name: Finalize INTIMACY binaries v2

on:
  push:
    branches: [work/intimacy-final-assets-20260903]
    paths: ['.github/workflows/finalize-intimacy-binaries-v2.yml']

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/intimacy-oracle
          curl -fL --retry 4 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1N62OZTszNEQ_7IGhwYjFu4ihnogYJZNT' -o assets/intimacy-oracle/back_intimacy_final.jpg
          curl -fL --retry 4 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1-OsEfKLXXfT9z6ZuX3tussZwg7p3l99Z' -o assets/intimacy-oracle/intimacy_sector_final.jpg
          curl -fL --retry 4 --retry-delay 2 'https://drive.google.com/uc?export=download&id=1_Ig4SSBjK8Y0gd0BRfLp00WMz5eyBVfa' -o assets/intimacy-oracle/oracle_atlas_final.jpg
      - name: Validate JPEG structure and dimensions
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          SOF = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
          expected = {
              'assets/intimacy-oracle/back_intimacy_final.jpg': (600, 800),
              'assets/intimacy-oracle/intimacy_sector_final.jpg': (600, 600),
              'assets/intimacy-oracle/oracle_atlas_final.jpg': (900, 1500),
          }

          def jpeg_size(data):
              assert data[:3] == b'\xff\xd8\xff', data[:8]
              i = 2
              while i < len(data) - 9:
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if marker == 0xDA:
                      break
                  if i + 2 > len(data):
                      break
                  seglen = int.from_bytes(data[i:i+2], 'big')
                  if seglen < 2 or i + seglen > len(data):
                      raise AssertionError(('bad JPEG segment', marker, seglen, i, len(data)))
                  if marker in SOF:
                      h = int.from_bytes(data[i+3:i+5], 'big')
                      w = int.from_bytes(data[i+5:i+7], 'big')
                      return w, h
                  i += seglen
              raise AssertionError('JPEG dimensions not found')

          for name, dims in expected.items():
              data = Path(name).read_bytes()
              assert data[-2:] == b'\xff\xd9', (name, data[-8:])
              actual_dims = jpeg_size(data)
              assert actual_dims == dims, (name, actual_dims, dims)
              assert len(data) > 50000, (name, len(data))
              print(name, len(data), actual_dims, hashlib.sha256(data).hexdigest())
      - name: Commit verified binaries and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/intimacy-oracle/back_intimacy_final.jpg assets/intimacy-oracle/intimacy_sector_final.jpg assets/intimacy-oracle/oracle_atlas_final.jpg
          git rm .github/workflows/finalize-intimacy-binaries-v2.yml
          git commit -m 'fix(intimacy): commit verified final artwork binaries'
          git push origin HEAD:work/intimacy-final-assets-20260903
