name: Test Daily Interpretation V2

on:
  pull_request:
    paths:
      - 'lunea-daily-interpretation-contract-v2.js'
      - 'lunea-boot-reveal-v29.js'
      - 'tests/daily-love-oracle-context-contract.test.mjs'
      - 'tests/daily-message-draft-prompt-regression.test.mjs'
      - 'tests/daily-message-draft-prompt.e2e.mjs'
      - 'tests/reading-lifecycle-v59.e2e.mjs'
      - '.github/workflows/test-daily-interpretation-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check lunea-daily-interpretation-contract-v2.js
          node --check lunea-boot-reveal-v29.js
          node --check tests/daily-love-oracle-context-contract.test.mjs
      - name: Daily V2 contract regression
        run: node tests/daily-love-oracle-context-contract.test.mjs
      - name: Existing Daily + Message source regression
        run: node tests/daily-message-draft-prompt-regression.test.mjs

  daily-message-webkit:
    needs: source-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-daily-v2-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-daily-v2-http.log
          exit 1
      - name: Run Daily + Message Oracle exact-draft E2E
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/daily-message-draft-prompt.e2e.mjs
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-daily-v2-http.log || true

  lifecycle-webkit:
    needs: source-contract
    strategy:
      fail-fast: false
      matrix:
        test:
          - reading-lifecycle-v59.e2e.mjs
          - lenormand-v1.e2e.mjs
          - meihua-v1.e2e.mjs
          - intimacy-oracle-late-runtime.e2e.mjs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-daily-v2-lifecycle.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-daily-v2-lifecycle.log
          exit 1
      - name: Run existing lifecycle E2E
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/${{ matrix.test }}
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-daily-v2-lifecycle.log || true
