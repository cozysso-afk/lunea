name: INTIMACY asset forensics

on:
  push:
    branches: [work/intimacy-final-assets-20260903]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover historical INTIMACY binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p asset-forensics
          git show 156b1154f70657fea06c9d8c61fd04f656e11b47:assets/intimacy-oracle/oracle_atlas_v36.jpg > asset-forensics/oracle_atlas_claimed_final_156b.jpg
          cp assets/intimacy-oracle/oracle_atlas_v36.jpg asset-forensics/oracle_atlas_current.jpg
          cp assets/intimacy-oracle/back_intimacy.svg asset-forensics/back_intimacy_current.svg
          file asset-forensics/*
          sha256sum asset-forensics/* > asset-forensics/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: intimacy-asset-forensics
          path: asset-forensics/
          if-no-files-found: error
          retention-days: 1
