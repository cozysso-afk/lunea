name: One-shot LUNEA boot gate V29

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install boot gate and reveal module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          loader = Path('lunea-structural-routing-v4.js')
          workflow = Path('.github/workflows/one-shot-boot-gate-v29.yml')
          reveal = Path('lunea-boot-reveal-v29.js')

          html = index.read_text(encoding='utf-8')
          head_marker = '<head>\n'
          gate_id = 'luneaBootGateV29'
          gate = r'''<script id="luneaBootGateV29">
          (()=>{
            const root=document.documentElement;
            root.classList.add('lunea-booting');
            window.__LUNEA_BOOT_STARTED__=performance.now();
            window.__LUNEA_BOOT_FAILSAFE__=setTimeout(()=>{
              root.classList.remove('lunea-booting');
              root.classList.add('lunea-ui-ready');
            },3500);
          })();
          </script>
          <style id="luneaBootGateV29Style">
          html.lunea-booting,html.lunea-booting body{background:#060713!important;overflow:hidden!important}
          html.lunea-booting body>.app,
          html.lunea-booting body>.sheet,
          html.lunea-booting body>.overlay{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
          html.lunea-booting body::before{
            content:'';position:fixed;inset:0;z-index:2147483000;pointer-events:none;
            background:
              radial-gradient(circle at 50% 43%,rgba(205,190,255,.16) 0 7%,transparent 23%),
              radial-gradient(circle at 50% 46%,rgba(112,222,213,.075),transparent 34%),
              linear-gradient(180deg,#080a18 0%,#090918 52%,#050610 100%);
          }
          html.lunea-booting body::after{
            content:'☾  L U N E A';position:fixed;left:50%;top:46%;z-index:2147483001;
            transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
            color:#f4efff;font:600 18px/1.2 Georgia,'Times New Roman',serif;letter-spacing:5px;
            text-shadow:0 0 22px rgba(204,187,255,.42),0 0 36px rgba(108,220,211,.14);
            animation:luneaBootPulseV29 1.35s ease-in-out infinite alternate;
          }
          @keyframes luneaBootPulseV29{from{opacity:.68;filter:blur(.1px)}to{opacity:1;filter:blur(0)}}
          html.lunea-ui-ready .app{animation:luneaBootRevealV29 .28s cubic-bezier(.2,.8,.2,1) both}
          @keyframes luneaBootRevealV29{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
          @media(prefers-reduced-motion:reduce){html.lunea-booting body::after,html.lunea-ui-ready .app{animation:none!important}}
          </style>
          '''
          if gate_id not in html:
              if head_marker not in html:
                  raise SystemExit('index head marker not found')
              html = html.replace(head_marker, head_marker + gate, 1)
              index.write_text(html, encoding='utf-8')

          reveal.write_text(r'''\'use strict\';
          (()=>{
            if(window.__LUNEA_BOOT_REVEAL_V29__)return;
            window.__LUNEA_BOOT_REVEAL_V29__=true;
            const root=document.documentElement;
            let done=false;
            const reveal=()=>{
              if(done)return;done=true;
              clearTimeout(window.__LUNEA_BOOT_FAILSAFE__);
              const started=Number(window.__LUNEA_BOOT_STARTED__||performance.now());
              const wait=Math.max(0,140-(performance.now()-started));
              setTimeout(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
                root.classList.remove('lunea-booting');
                root.classList.add('lunea-ui-ready');
              })),wait);
            };
            const readyEnough=()=>!!(
              document.querySelector('#luneaHomePortalV8 .lunea-v8-tile') ||
              document.querySelector('.lunea-v8-grid .lunea-v8-tile')
            );
            const afterDom=()=>{
              const start=performance.now();
              const probe=()=>{
                if(readyEnough() || performance.now()-start>1200)return reveal();
                requestAnimationFrame(probe);
              };
              probe();
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',afterDom,{once:true});
            else afterDom();
            window.LUNEA_BOOT_REVEAL_V29=reveal;
          })();
          ''', encoding='utf-8')

          src = loader.read_text(encoding='utf-8')
          doc_anchor = '    document.write(\'<script src="./lunea-sector-color-system-v28.js?v=2801"><\\/script>\');\n'
          doc_line = '    document.write(\'<script src="./lunea-boot-reveal-v29.js?v=2901"><\\/script>\');\n'
          seq_anchor = "    './lunea-sector-color-system-v28.js?v=2801'\n"
          seq_line = "    './lunea-boot-reveal-v29.js?v=2901'\n"
          if 'lunea-boot-reveal-v29.js' not in src:
              if doc_anchor not in src or seq_anchor not in src:
                  raise SystemExit('loader V28 anchors not found')
              src = src.replace(doc_anchor, doc_anchor + doc_line, 1)
              src = src.replace(seq_anchor, "    './lunea-sector-color-system-v28.js?v=2801',\n" + seq_line, 1)
              src = src.replace('mobile long-question / journal visual repair V27.', 'mobile long-question / journal visual repair V27 + sector color continuity V28 + flicker-free boot gate V29.')
              loader.write_text(src, encoding='utf-8')

          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: prevent legacy UI flash on LUNEA startup"
          git push
