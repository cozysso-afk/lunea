name: Oracle artwork topics and navigation regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'lunea-timing-ab-inline-v16.js'
      - 'lunea-thai-tarot-bridge-v32.js'
      - 'lunea-horary-balance-v19-5.js'
      - 'lunea-intimacy-ai-bridge-v34.js'
      - 'lunea-intimacy-repair-v43.js'
      - 'tests/oracle-topic-routing.test.mjs'
      - 'tests/oracle-ui-regressions.e2e.mjs'
      - '.github/workflows/oracle-ui-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and all source regressions
        run: |
          node --check lunea-timing-ab-inline-v16.js
          node --check lunea-thai-tarot-bridge-v32.js
          node --check lunea-horary-balance-v19-5.js
          node --check lunea-intimacy-ai-bridge-v34.js
          node --check lunea-intimacy-repair-v43.js
          node --check tests/oracle-ui-regressions.e2e.mjs
          node --test tests/*.test.mjs
  mobile-webkit:
    needs: source-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-oracle-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-oracle-http.log
          exit 1
      - name: Verify Oracle artwork, topic payloads, manual overrides and sector exits
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/oracle-ui-regressions.e2e.mjs
