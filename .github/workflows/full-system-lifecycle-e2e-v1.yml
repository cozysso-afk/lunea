name: Full System Lifecycle E2E V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/system-support-lifecycle-v1.e2e.mjs'
      - '.github/workflows/full-system-lifecycle-e2e-v1.yml'
      - 'astro-horary-v1.js'
      - 'lunea-prashna-v1.js'
      - 'lunea-thai-standalone-v24.js'
      - 'vedic-profile-v1.js'
      - 'lunea-reading-lifecycle-v59.js'
      - 'lunea-lenormand-v1.js'
      - 'lunea-meihua-v1.js'
      - 'lunea-intimacy-oracle-ui-v36.js'
      - 'lunea-cache-refresh-v1.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-systems-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check support-system E2E
        run: node --check tests/system-support-lifecycle-v1.e2e.mjs
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-system-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-system-http.log
          exit 1
      - name: Run Horary Prashna Thai Vedic lifecycle E2E
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/system-support-lifecycle-v1.e2e.mjs
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-system-http.log || true

  existing-reading-e2e:
    strategy:
      fail-fast: false
      matrix:
        test:
          - reading-lifecycle-v59.e2e.mjs
          - lenormand-v1.e2e.mjs
          - meihua-v1.e2e.mjs
          - intimacy-oracle-late-runtime.e2e.mjs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-existing-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-existing-http.log
          exit 1
      - name: Run existing system E2E
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/${{ matrix.test }}
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-existing-http.log || true
