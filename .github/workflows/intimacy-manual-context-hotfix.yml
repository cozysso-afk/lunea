name: Hotfix manual category context

on:
  push:
    branches:
      - work/intimacy-manual-context-hotfix-20260904
    paths:
      - '.github/workflows/intimacy-manual-context-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch manual category preservation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Base manual entry: never hard-code GENERAL. Resolve the category of
          # the actual manual item/container, remember it, and preserve it through <=12 draws.
          replace_once(
              'lunea-manual-structure-v1.js',
              "    const openManual = () => {\n      const opener = W.openSheet || openSheet;\n      opener('GENERAL', '직접 입력 배열', 'AI 자동 배열이 마음에 안 들 때 카드 포지션을 직접 고정합니다.', 1);\n      state.__luneaManualMode = true;\n      state.__luneaManualReading = false;\n      state.isAi = false;",
              "    const openManual = () => {\n      const opener = W.openSheet || openSheet;\n      const manualItem = document.getElementById('luneaManualReadingItem');\n      const containerCategory = String(manualItem?.closest?.('.category-content')?.querySelector?.('.reading-item[data-cat]')?.dataset?.cat || '').trim().toUpperCase();\n      let currentCategory = '';\n      try { currentCategory = String(state?.category || '').trim().toUpperCase(); } catch {}\n      const originCategory = containerCategory || currentCategory || 'GENERAL';\n      try {\n        state.__luneaManualOriginCategory = originCategory;\n        state.category = originCategory;\n        state.__luneaIntimacyReading = originCategory === 'INTIMACY';\n      } catch {}\n      opener(originCategory, '직접 입력 배열', 'AI 자동 배열이 마음에 안 들 때 카드 포지션을 직접 고정합니다.', 1);\n      state.__luneaManualMode = true;\n      state.__luneaManualReading = false;\n      state.isAi = false;\n      state.__luneaManualOriginCategory = originCategory;\n      state.category = originCategory;\n      state.__luneaIntimacyReading = originCategory === 'INTIMACY';"
          )
          replace_once(
              'lunea-manual-structure-v1.js',
              "  function startManualSpread(question, positions, title, rationale, learn=true) {\n    state.__luneaManualReading = true;",
              "  function startManualSpread(question, positions, title, rationale, learn=true) {\n    const originCategory = String(state?.__luneaManualOriginCategory || state?.category || 'GENERAL').trim().toUpperCase() || 'GENERAL';\n    state.__luneaManualOriginCategory = originCategory;\n    state.category = originCategory;\n    state.__luneaIntimacyReading = originCategory === 'INTIMACY';\n    state.__luneaManualReading = true;"
          )

          # 2) Category-specific manual entries: stamp/preserve origin category before AND
          # after openSheet, and keep rescanning briefly so late-created INTIMACY is not missed.
          replace_once(
              'lunea-manual-everywhere-v1.js',
              "  function openManualForCategory(category) {\n    const cat = String(category || 'GENERAL').trim() || 'GENERAL';\n    const opener = W.openSheet || (typeof openSheet === 'function' ? openSheet : null);\n    if (typeof opener !== 'function') return;\n\n    opener(\n      cat,",
              "  function openManualForCategory(category) {\n    const cat = (String(category || 'GENERAL').trim() || 'GENERAL').toUpperCase();\n    const opener = W.openSheet || (typeof openSheet === 'function' ? openSheet : null);\n    if (typeof opener !== 'function') return;\n\n    try {\n      state.__luneaManualOriginCategory = cat;\n      state.category = cat;\n      state.__luneaIntimacyReading = cat === 'INTIMACY';\n    } catch {}\n\n    opener(\n      cat,"
          )
          replace_once(
              'lunea-manual-everywhere-v1.js',
              "    try {\n      state.__luneaManualMode = true;\n      state.__luneaManualReading = false;\n      state.isAi = false;\n    } catch {}",
              "    try {\n      state.__luneaManualMode = true;\n      state.__luneaManualReading = false;\n      state.isAi = false;\n      state.__luneaManualOriginCategory = cat;\n      state.category = cat;\n      state.__luneaIntimacyReading = cat === 'INTIMACY';\n    } catch {}"
          )

          p = Path('lunea-manual-everywhere-v1.js')
          text = p.read_text(encoding='utf-8')
          old_install = """  function install() {\n    if (!W.LUNEA_MANUAL_SPREAD_V1 || !document.getElementById('luneaManualPanel')) {\n      setTimeout(install, 40);\n      return;\n    }\n\n    document.querySelectorAll('.category-content').forEach(content => {\n      const firstReading = content.querySelector('.reading-item[data-cat]');\n      if (!firstReading) return;\n\n      const category = String(firstReading.dataset.cat || 'GENERAL').trim() || 'GENERAL';\n\n      // GENERAL already receives its manual entry from Manual Structure V1.\n      if (category === 'GENERAL' && content.querySelector('#luneaManualReadingItem')) return;\n      if (content.querySelector('.lunea-manual-anywhere-item')) return;\n\n      const item = makeManualItem(category);\n      firstReading.insertAdjacentElement('beforebegin', item);\n    });\n\n    console.info('🌙 LUNEA Manual Spread Everywhere V1 loaded');\n  }\n"""
          new_install = """  function scanCategories() {\n    if (!W.LUNEA_MANUAL_SPREAD_V1 || !document.getElementById('luneaManualPanel')) return false;\n    document.querySelectorAll('.category-content').forEach(content => {\n      const firstReading = content.querySelector('.reading-item[data-cat]');\n      if (!firstReading) return;\n\n      const category = (String(firstReading.dataset.cat || 'GENERAL').trim() || 'GENERAL').toUpperCase();\n\n      // GENERAL already receives its manual entry from Manual Structure V1.\n      if (category === 'GENERAL' && content.querySelector('#luneaManualReadingItem')) return;\n      if (content.querySelector('.lunea-manual-anywhere-item')) return;\n\n      const item = makeManualItem(category);\n      firstReading.insertAdjacentElement('beforebegin', item);\n    });\n    return true;\n  }\n\n  function install() {\n    if (!scanCategories()) {\n      setTimeout(install, 40);\n      return;\n    }\n\n    // INTIMACY and future late feature cabinets can be injected after this module's\n    // first DOMContentLoaded pass. Re-scan mutations briefly instead of silently\n    // falling back to the GENERAL manual entry.\n    let queued = false;\n    const observer = new MutationObserver(() => {\n      if (queued) return;\n      queued = true;\n      setTimeout(() => { queued = false; scanCategories(); }, 0);\n    });\n    if (document.body) observer.observe(document.body, {childList:true,subtree:true});\n    [80, 250, 800, 2000].forEach(ms => setTimeout(scanCategories, ms));\n    setTimeout(() => observer.disconnect(), 5000);\n\n    console.info('🌙 LUNEA Manual Spread Everywhere V1 loaded');\n  }\n"""
          if old_install not in text:
              raise SystemExit('missing manual-everywhere install block')
          p.write_text(text.replace(old_install, new_install, 1), encoding='utf-8')

          # 3) 13-20 card manual path must preserve the same category too.
          replace_once(
              'lunea-manual-limit20-v17.js',
              "    try {\n      state.__luneaManualReading = true;\n      state.question = question || '현재 나에게 필요한 흐름';",
              "    try {\n      const originCategory = String(state?.__luneaManualOriginCategory || state?.category || 'GENERAL').trim().toUpperCase() || 'GENERAL';\n      state.__luneaManualOriginCategory = originCategory;\n      state.category = originCategory;\n      state.__luneaIntimacyReading = originCategory === 'INTIMACY';\n      state.__luneaManualReading = true;\n      state.question = question || '현재 나에게 필요한 흐름';"
          )

          # 4) Force iOS/PWA to fetch the patched nested manual modules.
          loader = Path('lunea-structural-routing-v4.js')
          s = loader.read_text(encoding='utf-8')
          for old, new in [
              ('lunea-manual-structure-v1.js?v=102', 'lunea-manual-structure-v1.js?v=103'),
              ('lunea-manual-everywhere-v1.js?v=101', 'lunea-manual-everywhere-v1.js?v=102'),
              ('lunea-manual-limit20-v17.js?v=1702', 'lunea-manual-limit20-v17.js?v=1703'),
          ]:
              count = s.count(old)
              if count != 2:
                  raise SystemExit(f'expected two loader refs for {old}, got {count}')
              s = s.replace(old, new)
          loader.write_text(s, encoding='utf-8')

          print('manual category preservation hotfix applied')
          PY

      - name: Add regression contract
        shell: bash
        run: |
          cat > tests/manual-category-preservation.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const read = name => fs.readFileSync(new URL(`../${name}`, import.meta.url), 'utf8');
          const manual = read('lunea-manual-structure-v1.js');
          const everywhere = read('lunea-manual-everywhere-v1.js');
          const manual20 = read('lunea-manual-limit20-v17.js');
          const loader = read('lunea-structural-routing-v4.js');

          test('base manual entry resolves its owning category instead of hard-coding GENERAL', () => {
            assert.doesNotMatch(manual, /opener\(\s*['"]GENERAL['"]/);
            assert.match(manual, /__luneaManualOriginCategory = originCategory/);
            assert.match(manual, /state\.category = originCategory/);
            assert.match(manual, /state\.__luneaIntimacyReading = originCategory === 'INTIMACY'/);
          });

          test('category-specific manual entry preserves category and catches late INTIMACY cabinets', () => {
            assert.match(everywhere, /item\.dataset\.cat = category/);
            assert.match(everywhere, /state\.__luneaManualOriginCategory = cat/);
            assert.match(everywhere, /state\.category = cat/);
            assert.match(everywhere, /MutationObserver/);
            assert.match(everywhere, /scanCategories/);
          });

          test('13-20 card manual path preserves origin category', () => {
            assert.match(manual20, /__luneaManualOriginCategory \|\| state\?\.category/);
            assert.match(manual20, /state\.category = originCategory/);
            assert.match(manual20, /state\.__luneaIntimacyReading = originCategory === 'INTIMACY'/);
          });

          test('nested loader cache keys are bumped in parser and sequential paths', () => {
            assert.equal((loader.match(/lunea-manual-structure-v1\.js\?v=103/g) || []).length, 2);
            assert.equal((loader.match(/lunea-manual-everywhere-v1\.js\?v=102/g) || []).length, 2);
            assert.equal((loader.match(/lunea-manual-limit20-v17\.js\?v=1703/g) || []).length, 2);
            assert.doesNotMatch(loader, /lunea-manual-structure-v1\.js\?v=102/);
          });
          EOF

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          node --check lunea-manual-structure-v1.js
          node --check lunea-manual-everywhere-v1.js
          node --check lunea-manual-limit20-v17.js
          node --check lunea-structural-routing-v4.js
          node tests/manual-category-preservation.test.mjs
          node tests/spread-learning-integration-contract.test.mjs
          node tests/intimacy-ai-bridge-v34.test.mjs
          node tests/intimacy-asset-routing-v43.test.mjs
          node tests/intimacy-burgundy-v40.test.mjs
          node tests/intimacy-tarot-visual-v40.test.mjs

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lunea-manual-structure-v1.js lunea-manual-everywhere-v1.js lunea-manual-limit20-v17.js lunea-structural-routing-v4.js tests/manual-category-preservation.test.mjs
          git commit -m 'fix(intimacy): preserve category through manual spreads'
          git push origin HEAD:work/intimacy-manual-context-hotfix-20260904
