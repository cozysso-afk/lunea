name: Run Horary V58 Save Adjust
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horary-future-window-save-v58
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply adjustment
        run: python .github/scripts/adjust_horary_v58_save.py
      - name: Run focused contracts
        run: |
          node tests/horary-future-window-save-v58.test.mjs
          node tests/horary-post-actions-v44.test.mjs
          node tests/horary-mobile-actions-v45.test.mjs
      - name: Commit adjustment
        shell: bash
        run: |
          rm -f .github/workflows/_run-horary-v58-save-adjust.yml
          rm -f .github/scripts/adjust_horary_v58_save.py
          git config user.name 'openai-codex'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden Horary mobile save path'
          git push origin HEAD:fix/horary-future-window-save-v58
