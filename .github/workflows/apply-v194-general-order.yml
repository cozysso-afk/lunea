name: Apply V19.4 and General Order

on:
  push:
    branches: [fix/horary-v19-4-general-order]

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/horary-v19-4-general-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch loader and regression contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = Path('lunea-structural-routing-v4.js')
          text = loader.read_text()
          old_doc = "    document.write('<script src=\"./lunea-horary-balance-v18.js?v=1803\"><\\/script>');\n    document.write('<script src=\"./lunea-horary-balance-v19.js?v=1903\"><\\/script>');"
          new_doc = "    document.write('<script src=\"./lunea-horary-balance-v19-4.js?v=1904\"><\\/script>');"
          old_seq = "    './lunea-horary-balance-v18.js?v=1803',\n    './lunea-horary-balance-v19.js?v=1903',"
          new_seq = "    './lunea-horary-balance-v19-4.js?v=1904',"
          if old_doc not in text or old_seq not in text:
              raise SystemExit('Horary V18/V19 loader pair not found')
          text = text.replace(old_doc, new_doc, 1).replace(old_seq, new_seq, 1)

          fixed_doc = "    document.write('<script src=\"./lunea-fixed-spread-depth-v30.js?v=3003\"><\\/script>');"
          fixed_seq = "    './lunea-fixed-spread-depth-v30.js?v=3003',"
          order_doc = fixed_doc + "\n    document.write('<script src=\"./lunea-general-order-v30-4.js?v=3004\"><\\/script>');"
          order_seq = fixed_seq + "\n    './lunea-general-order-v30-4.js?v=3004',"
          if fixed_doc not in text or fixed_seq not in text:
              raise SystemExit('V30 loader anchor not found')
          text = text.replace(fixed_doc, order_doc, 1).replace(fixed_seq, order_seq, 1)
          loader.write_text(text)

          test = Path('tests/v30-spread-horary-contract.test.mjs')
          text = test.read_text()
          text = text.replace("const horary = read('lunea-horary-balance-v19.js');", "const horary = read('lunea-horary-balance-v19-4.js');\nconst generalOrder = read('lunea-general-order-v30-4.js');")
          text = text.replace("/version:\\s*19\\.3/", "/version:\\s*19\\.4/")
          text = text.replace("/lunea-horary-balance-v19\\.js\\?v=1903/", "/lunea-horary-balance-v19-4\\.js\\?v=1904/")
          marker = "assert.match(loader, /lunea-fixed-spread-depth-v30\\.js\\?v=3003/, 'V30.3 cache URL missing');"
          addition = marker + "\nassert.match(loader, /lunea-general-order-v30-4\\.js\\?v=3004/, 'GENERAL V30.4 order cache URL missing');"
          if marker not in text:
              raise SystemExit('loader contract anchor missing')
          text = text.replace(marker, addition, 1)

          order_contract = """
          const finalGeneralOrder = ['ONE CARD','YES / NO','TIMELINE','5 CARD · CORE FLOW','6 CARD · FULL VIEW','DEEP FLOW','CELTIC CROSS'];
          let finalLast = -1;
          for (const title of finalGeneralOrder) {
            const idx = generalOrder.indexOf(`'${title}'`);
            assert.ok(idx > finalLast, `final GENERAL order wrong around ${title}`);
            finalLast = idx;
          }
          assert.match(generalOrder, /version:30\\.4/, 'GENERAL order V30.4 export missing');
          """
          insert_before = "const spreadIndex = loader.lastIndexOf('lunea-fixed-spread-depth-v30.js?v=3003');"
          if insert_before not in text:
              raise SystemExit('spreadIndex contract anchor missing')
          text = text.replace(insert_before, order_contract + "\n" + insert_before, 1)
          old_tail = "const revealIndex = loader.lastIndexOf('lunea-boot-reveal-v29.js?v=2902');\nassert.ok(spreadIndex >= 0 && revealIndex > spreadIndex, 'boot reveal must run after V30 UI patch');"
          new_tail = "const generalOrderIndex = loader.lastIndexOf('lunea-general-order-v30-4.js?v=3004');\nconst revealIndex = loader.lastIndexOf('lunea-boot-reveal-v29.js?v=2902');\nassert.ok(spreadIndex >= 0 && generalOrderIndex > spreadIndex, 'GENERAL V30.4 must run after spread-depth V30.3');\nassert.ok(revealIndex > generalOrderIndex, 'boot reveal must run after final GENERAL order patch');"
          if old_tail not in text:
              raise SystemExit('loader order tail missing')
          text = text.replace(old_tail, new_tail, 1)
          test.write_text(text)

          workflow = Path('.github/workflows/test-v30-spread-horary.yml')
          text = workflow.read_text()
          text = text.replace('node --check lunea-horary-balance-v19.js', 'node --check lunea-horary-balance-v19-4.js\n          node --check lunea-general-order-v30-4.js')
          workflow.write_text(text)
          PY
      - name: Validate syntax and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check lunea-horary-balance-v19-4.js
          node --check lunea-general-order-v30-4.js
          node --check lunea-structural-routing-v4.js
          for test in tests/*.test.mjs; do
            echo "==> $test"
            node "$test"
          done
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lunea-structural-routing-v4.js tests/v30-spread-horary-contract.test.mjs .github/workflows/test-v30-spread-horary.yml
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'fix: finalize Horary V19.4 bridge and GENERAL order'
          git push origin HEAD:fix/horary-v19-4-general-order
