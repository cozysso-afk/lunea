name: Intimacy Oracle supplemental cards branch checks

on:
  push:
    branches:
      - fix/intimacy-oracle-extra-cards
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intimacy-oracle-supplemental:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check lunea-intimacy-oracle-ui-v36.js
          node --check lunea-intimacy-ai-bridge-v34.js
          node --check tests/intimacy-oracle-extra-v365.e2e.mjs
      - name: Oracle data contract
        run: node tests/intimacy-oracle-v35.test.mjs
      - name: Supplemental draw and prompt separation contract
        run: node tests/intimacy-oracle-ui-v36.test.mjs
      - name: Flip and cache contract
        run: node --test tests/intimacy-oracle-flip-v46.test.mjs
      - name: Bridge contract
        run: node --test tests/intimacy-ai-bridge-v34.test.mjs
      - name: Manual integration regression
        run: node --test tests/intimacy-manual-oracle-back-integration.test.mjs
      - name: Lifecycle invariants still hold
        run: node tests/reading-lifecycle-v59.test.mjs

  intimacy-oracle-webkit:
    needs: intimacy-oracle-supplemental
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch-local LUNEA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-intimacy-http.log 2>&1 &
          echo $! >/tmp/lunea-intimacy-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lunea-intimacy-http.log
          exit 1
      - name: Run supplemental Oracle max-three WebKit regression
        env:
          LUNEA_E2E_URL: http://127.0.0.1:4173/index.html
        run: node tests/intimacy-oracle-extra-v365.e2e.mjs
      - name: Show local server log
        if: always()
        run: cat /tmp/lunea-intimacy-http.log || true
