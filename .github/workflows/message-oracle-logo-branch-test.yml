name: Message Oracle logo branch test

on:
  push:
    branches:
      - release/recovery-390432a-final

permissions:
  contents: read

jobs:
  message-oracle-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        stage: [load-ready, open-support, recovered-click]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch checkout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/lunea-http.log
          exit 1
      - name: Isolate Message Oracle stage
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { webkit } from 'playwright';
          const stage=process.env.STAGE;
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({viewport:{width:393,height:852},isMobile:true,hasTouch:true,deviceScaleFactor:3,locale:'ko-KR'});
          const page=await context.newPage();
          page.setDefaultTimeout(20000);
          const lifecycle=[],errors=[];
          page.on('close',()=>lifecycle.push('page-close'));
          page.on('crash',()=>lifecycle.push('page-crash'));
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          page.on('request',req=>{if(req.url().includes('message-oracle'))lifecycle.push('request:'+req.resourceType()+':'+req.url())});
          await page.route('**/lunea-build.json?*',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:'c2f26d2477d9'})}));
          await page.route(/https:\/\/fonts\.googleapis\.com\//,route=>route.fulfill({status:200,contentType:'text/css',body:''}));
          await page.route(/https:\/\/(?:fonts\.gstatic\.com|commons\.wikimedia\.org)\//,route=>route.fulfill({status:204,body:''}));
          await page.route(/lunea-astro-api[^/]*\.onrender\.com\/health/i,route=>route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{"ok":true}'}));
          await page.addInitScript(()=>{try{localStorage.clear();sessionStorage.clear();}catch{}});
          await page.goto('http://127.0.0.1:4173/index.html?stage='+stage+'&t='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.readyState==='complete'&&document.documentElement.classList.contains('lunea-ui-ready'));
          await page.waitForTimeout(1000);
          const entry=await page.evaluate(()=>{
            const item=[...document.querySelectorAll('.reading-item')].find(el=>String(el.dataset.cat||'').toUpperCase()==='GENERAL'&&el.dataset.title==='YES / NO');
            if(!item)return false;item.click();return true;
          });
          assert.equal(entry,true,'GENERAL YES / NO entry missing');
          await page.waitForSelector('#sheet.open');
          await page.locator('#question').fill('BRANCH UI · 단계 분리 진단');
          await page.locator('#drawBtn').click();
          await page.waitForSelector('#spreadOverlay.show');
          await page.waitForTimeout(300);
          const pre=await page.evaluate(()=>{const b=document.getElementById('luneaMessageOracleSupportBtn');const img=b?.querySelector('.lunea-message-oracle-mini-logo');return{button:!!b,logo:!!img,logoLoaded:!!img?.complete&&img.naturalWidth>0}});
          console.log('STAGE='+stage+' PRE='+JSON.stringify(pre));
          assert.deepEqual(pre,{button:true,logo:true,logoLoaded:true});

          const crash=new Promise(resolve=>page.once('crash',()=>resolve('page-crash')));
          const close=new Promise(resolve=>page.once('close',()=>resolve('page-close')));
          const load=page.evaluate(async()=>{
            const ok=await window.LUNEA_LOAD_FEATURE_GROUP('message');
            if(!ok||!window.LUNEA_MESSAGE_ORACLE_UI_V1)return 'load-failed';
            const ready=await window.LUNEA_MESSAGE_ORACLE_UI_V1.ready();
            return ready?'ready':'ready-false';
          }).catch(e=>'evaluate-error:'+e.message);
          const loadOutcome=await Promise.race([load,crash,close]);
          console.log('STAGE='+stage+' LOAD='+loadOutcome);
          if(stage==='load-ready'){
            console.log('STAGE='+stage+' LIFECYCLE='+JSON.stringify(lifecycle));
            console.log('STAGE='+stage+' ERRORS='+JSON.stringify(errors));
            assert.equal(loadOutcome,'ready');assert.deepEqual(errors,[]);await browser.close();process.exit(0);
          }
          assert.equal(loadOutcome,'ready','load/ready failed before '+stage);

          if(stage==='open-support'){
            const outcome=await Promise.race([
              page.evaluate(async()=>{const q='BRANCH UI · 단계 분리 진단';await window.LUNEA_MESSAGE_ORACLE_UI_V1.openSupport({question:q,result:null,isCurrent:()=>true,onResult:()=>true});return document.getElementById('luneaMessageOracleOverlay')?.dataset.open==='true'?'open':'not-open'}).catch(e=>'evaluate-error:'+e.message),
              new Promise(resolve=>page.once('crash',()=>resolve('page-crash'))),
              new Promise(resolve=>page.once('close',()=>resolve('page-close')))
            ]);
            console.log('STAGE='+stage+' OUTCOME='+outcome);
            console.log('STAGE='+stage+' LIFECYCLE='+JSON.stringify(lifecycle));
            console.log('STAGE='+stage+' ERRORS='+JSON.stringify(errors));
            assert.equal(outcome,'open');assert.deepEqual(errors,[]);await browser.close();process.exit(0);
          }

          await page.evaluate(()=>document.getElementById('luneaMessageOracleSupportBtn')?.remove());
          await page.waitForFunction(()=>!!document.getElementById('luneaMessageOracleSupportBtn'));
          const recovered=await page.evaluate(()=>!!document.querySelector('#luneaMessageOracleSupportBtn .lunea-message-oracle-mini-logo'));
          assert.equal(recovered,true,'recovered button has no logo');
          await page.locator('#luneaMessageOracleSupportBtn').click();
          const outcome=await Promise.race([
            page.waitForFunction(()=>document.getElementById('luneaMessageOracleOverlay')?.dataset.open==='true',{},{timeout:12000}).then(()=> 'open').catch(e=>'wait-error:'+e.message),
            new Promise(resolve=>page.once('crash',()=>resolve('page-crash'))),
            new Promise(resolve=>page.once('close',()=>resolve('page-close')))
          ]);
          console.log('STAGE='+stage+' OUTCOME='+outcome);
          console.log('STAGE='+stage+' LIFECYCLE='+JSON.stringify(lifecycle));
          console.log('STAGE='+stage+' ERRORS='+JSON.stringify(errors));
          assert.equal(outcome,'open');assert.deepEqual(errors,[]);await browser.close();
          NODE
