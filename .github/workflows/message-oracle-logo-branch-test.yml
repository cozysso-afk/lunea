name: Message Oracle logo branch test

on:
  push:
    branches:
      - release/recovery-390432a-final

permissions:
  contents: read

jobs:
  message-oracle-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        asset_mode: [tiny-masks, tiny-all-art]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch checkout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/lunea-http.log
          exit 1
      - name: Verify logo, recovery and click path with isolated artwork
        env:
          ASSET_MODE: ${{ matrix.asset_mode }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { webkit } from 'playwright';
          const mode=process.env.ASSET_MODE;
          const tinyPng=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=','base64');
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:393,height:852},isMobile:true,hasTouch:true,deviceScaleFactor:3,
            locale:'ko-KR',userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          });
          const page=await context.newPage();
          page.setDefaultTimeout(20000);
          const errors=[];
          const lifecycle=[];
          page.on('close',()=>lifecycle.push('page-close'));
          page.on('crash',()=>lifecycle.push('page-crash'));
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          page.on('request',req=>{if(req.url().includes('message-oracle')) lifecycle.push('request:'+req.resourceType()+':'+req.url())});
          await page.route('**/lunea-build.json?*', route => route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:'c2f26d2477d9'})}));
          await page.route(/https:\/\/fonts\.googleapis\.com\//, route => route.fulfill({status:200,contentType:'text/css',body:''}));
          await page.route(/https:\/\/(?:fonts\.gstatic\.com|commons\.wikimedia\.org)\//, route => route.fulfill({status:204,body:''}));
          await page.route(/lunea-astro-api[^/]*\.onrender\.com\/health/i, route => route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{"ok":true}'}));
          if(mode==='tiny-masks' || mode==='tiny-all-art'){
            await page.route(/assets\/message-oracle\/message_oracle_(?:front_mask|back_mask)\.png/i, route => route.fulfill({status:200,contentType:'image/png',body:tinyPng}));
          }
          if(mode==='tiny-all-art'){
            await page.route(/assets\/message-oracle\/message_oracle_(?:front_frame|back)\.jpeg/i, route => route.fulfill({status:200,contentType:'image/png',body:tinyPng}));
          }
          await page.addInitScript(()=>{try{localStorage.clear();sessionStorage.clear();}catch{}});
          await page.goto('http://127.0.0.1:4173/index.html?asset_mode='+encodeURIComponent(mode)+'&t='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.readyState==='complete'&&document.documentElement.classList.contains('lunea-ui-ready'));
          await page.waitForTimeout(1200);
          const entry=await page.evaluate(()=>{
            const item=[...document.querySelectorAll('.reading-item')].find(el=>String(el.dataset.cat||'').toUpperCase()==='GENERAL'&&el.dataset.title==='YES / NO');
            if(!item)return false; item.click(); return true;
          });
          assert.equal(entry,true,'GENERAL YES / NO entry missing');
          await page.waitForSelector('#sheet.open');
          await page.locator('#question').fill('BRANCH UI · WebKit artwork isolation');
          await page.locator('#drawBtn').click();
          await page.waitForSelector('#spreadOverlay.show');
          await page.waitForTimeout(300);
          let diag=await page.evaluate(()=>{
            const b=document.getElementById('luneaMessageOracleSupportBtn');
            const img=b?.querySelector('.lunea-message-oracle-mini-logo');
            return {button:!!b,logo:!!img,logoLoaded:!!img?.complete&&img.naturalWidth>0};
          });
          console.log('MODE='+mode+' PRECLICK='+JSON.stringify(diag));
          assert.deepEqual(diag,{button:true,logo:true,logoLoaded:true});
          await page.evaluate(()=>document.getElementById('luneaMessageOracleSupportBtn')?.remove());
          await page.waitForFunction(()=>!!document.getElementById('luneaMessageOracleSupportBtn'));
          const closed=new Promise(resolve=>page.once('close',()=>resolve('page-close')));
          const crashed=new Promise(resolve=>page.once('crash',()=>resolve('page-crash')));
          await page.locator('#luneaMessageOracleSupportBtn').click();
          const outcome=await Promise.race([
            page.waitForFunction(()=>!!window.LUNEA_MESSAGE_ORACLE_UI_V1&&document.getElementById('luneaMessageOracleOverlay')?.dataset.open==='true',{},{timeout:15000}).then(()=> 'ui-open').catch(e=>'wait-error:'+e.message),
            closed,
            crashed
          ]);
          console.log('MODE='+mode+' OUTCOME='+outcome);
          console.log('MODE='+mode+' LIFECYCLE='+JSON.stringify(lifecycle));
          console.log('MODE='+mode+' ERRORS='+JSON.stringify(errors));
          assert.equal(outcome,'ui-open',`Message Oracle did not open in ${mode}: ${outcome}; lifecycle=${JSON.stringify(lifecycle)}`);
          assert.deepEqual(errors,[],`browser errors in ${mode}: ${errors.join('\n')}`);
          await browser.close();
          console.log('MESSAGE ORACLE ARTWORK ISOLATION '+mode+': PASS');
          NODE
