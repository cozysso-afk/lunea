name: Message Oracle logo branch test

on:
  push:
    branches:
      - release/recovery-390432a-final

permissions:
  contents: read

jobs:
  message-oracle-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start branch checkout
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/lunea-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/lunea-http.log
          exit 1
      - name: Verify logo, visibility, recovery and click path
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { webkit } from 'playwright';
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:393,height:852},isMobile:true,hasTouch:true,deviceScaleFactor:3,
            locale:'ko-KR',userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          });
          const page=await context.newPage();
          page.setDefaultTimeout(20000);
          const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error') errors.push('console: '+m.text())});
          await page.route('**/lunea-build.json?*', route => route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({version:'branch-test'})}));
          await page.route(/https:\/\/fonts\.googleapis\.com\//, route => route.fulfill({status:200,contentType:'text/css',body:''}));
          await page.route(/https:\/\/(?:fonts\.gstatic\.com|commons\.wikimedia\.org)\//, route => route.fulfill({status:204,body:''}));
          await page.route(/lunea-astro-api[^/]*\.onrender\.com\/health/i, route => route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:'{"ok":true}'}));
          await page.addInitScript(()=>{try{localStorage.clear();sessionStorage.clear();}catch{}});
          await page.goto('http://127.0.0.1:4173/index.html?branch_ui='+Date.now(),{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>document.readyState==='complete'&&document.documentElement.classList.contains('lunea-ui-ready'));
          await page.waitForTimeout(1200);
          const entry=await page.evaluate(()=>{
            const item=[...document.querySelectorAll('.reading-item')].find(el=>String(el.dataset.cat||'').toUpperCase()==='GENERAL'&&el.dataset.title==='YES / NO');
            if(!item)return false; item.click(); return true;
          });
          assert.equal(entry,true,'GENERAL YES / NO entry missing');
          await page.waitForSelector('#sheet.open');
          await page.locator('#question').fill('BRANCH UI · 메시지 오라클 로고와 버튼 복구');
          await page.locator('#drawBtn').click();
          await page.waitForSelector('#spreadOverlay.show');
          await page.waitForTimeout(300);
          let diag=await page.evaluate(()=>{
            const b=document.getElementById('luneaMessageOracleSupportBtn');
            const img=b?.querySelector('.lunea-message-oracle-mini-logo');
            const r=b?.getBoundingClientRect();
            return {exists:!!b,text:b?.textContent||'',img:!!img,src:img?.getAttribute('src')||'',loaded:!!img?.complete&&img.naturalWidth>0,rect:r?{x:r.x,y:r.y,w:r.width,h:r.height}:null,hit:r?document.elementFromPoint(r.left+r.width/2,r.top+r.height/2)?.id||'':''};
          });
          console.log('INITIAL='+JSON.stringify(diag));
          assert.equal(diag.exists,true,'Message Oracle button missing');
          assert.equal(diag.img,true,'Message Oracle mini logo missing');
          assert.match(diag.src,/assets\/message-oracle\/message_oracle_logo\.png/,'wrong mini logo asset');
          assert.equal(diag.loaded,true,'mini logo failed to load');
          assert.equal(diag.hit,'luneaMessageOracleSupportBtn','button is obscured');

          await page.evaluate(()=>document.getElementById('luneaMessageOracleSupportBtn')?.remove());
          await page.waitForFunction(()=>!!document.getElementById('luneaMessageOracleSupportBtn'));
          diag=await page.evaluate(()=>({exists:!!document.getElementById('luneaMessageOracleSupportBtn'),img:!!document.querySelector('#luneaMessageOracleSupportBtn .lunea-message-oracle-mini-logo')}));
          console.log('RECOVERED='+JSON.stringify(diag));
          assert.deepEqual(diag,{exists:true,img:true},'button did not recover after removal');

          await page.locator('#luneaMessageOracleSupportBtn').click();
          await page.waitForFunction(()=>!!window.LUNEA_MESSAGE_ORACLE_V1 && !!window.LUNEA_MESSAGE_ORACLE_UI_V1);
          const afterClick=await page.evaluate(()=>({engine:!!window.LUNEA_MESSAGE_ORACLE_V1,ui:!!window.LUNEA_MESSAGE_ORACLE_UI_V1,button:!!document.getElementById('luneaMessageOracleSupportBtn')}));
          console.log('CLICK='+JSON.stringify(afterClick));
          assert.deepEqual(afterClick,{engine:true,ui:true,button:true});
          assert.deepEqual(errors,[],`browser errors: ${errors.join('\n')}`);
          await browser.close();
          console.log('MESSAGE ORACLE LOGO BRANCH TEST: PASS');
          NODE
